        const allQuestions = [
            {id:1,domain:1,domainName:"المعرفة المهنية",question:"يلاحظ مدرب أن بعض المتدربين يفضلون التعلم من خلال الممارسة العملية المباشرة، بينما يفضل آخرون القراءة والتأمل. ما المفهوم الذي يصف هذه الظاهرة بدقة؟",options:[{text:"الفروق الفردية وأنماط التعلم المتنوعة لدى المتدربين",isCorrect:true,rationale:"تتفاوت استجابة المتدربين للأساليب التدريبية بناءً على نمط استيعابهم (بصري، سمعي، حركي، تأملي)، وهو جوهر مراعاة الفروق الفردية."},{text:"ضعف الدافعية الداخلية لدى بعض المتدربين",isCorrect:false,rationale:"تفضيل أسلوب لا يعني ضعف الدافعية، بل يعني اختلاف القناة الإدراكية المفضلة."},{text:"اختلاف المستوى المعرفي السابق بين المتدربين",isCorrect:false,rationale:"المستوى المعرفي يتعلق بالحصيلة العلمية السابقة، بينما السيناريو يتعلق بطريقة المعالجة والتعلم."},{text:"تباين الأهداف الشخصية لكل متدرب",isCorrect:false,rationale:"الأهداف تتعلق بالغاية المنشودة من التدريب وليست بطريقة استيعاب المادة."}]},

            {id:9,domain:1,domainName:"المعرفة المهنية",question:"ما المقصود بـ 'التعليم المقلوب' (Flipped Classroom) في البيئة التدريبية الحديثة؟",options:[{text:"إلغاء التطبيق العملي والاقتصار على المحاضرة النظرية",isCorrect:false,rationale:"التعليم المقلوب يضاعف وقت التطبيق العملي التفاعلي."},{text:"إطلاع المتدربين على المحتوى النظري قبل الجلسة واستغلال وقت اللقاء للتطبيق والتفاعل",isCorrect:true,rationale:"يتم تقديم المعرفة النظرية ذاتياً قبل الجلسة، وتُخصص الجلسة النقاشية للتطبيق والتحليل."},{text:"تدريب المتدربين على المهارات العكسية التي لا يحتاجونها",isCorrect:false,rationale:"تعريف خاطئ للمفهوم."},{text:"قيام المتدربين بشرح الحقيبة كاملاً بدلاً من المدرب",isCorrect:false,rationale:"المدرب يظل موثقاً وميسراً وموجهاً أثناء الأنشطة في القاعة."}]},

            {id:11,domain:1,domainName:"المعرفة المهنية",question:"ما الهدف الرئيسي من استخدام 'أنشطة كسر الجمود' (Icebreakers) في بداية الدورة؟",options:[{text:"إهداء الوقت حتى يكتمل عدد المتدربين",isCorrect:false,rationale:"المقصود منه هدف تربوي ونفسي وليس إهدار الوقت."},{text:"تخفيف التوتر وبناء الألفة وخلق بيئة تفاعلية آمنة",isCorrect:true,rationale:"تساعد الأنشطة الافتتاحية في حصر الانتباه، وإزالة الحاجز النفسي والتعارف."},{text:"اختبار قدرات المتدربين بشكل معقد لإحراجهم",isCorrect:false,rationale:"يتنافى تماماً مع إيجابية البيئة التدريبية."},{text:"إنهاء المادة النظرية بصورة سريعة",isCorrect:false,rationale:"أنشطة الجمود لا تتناول المحتوى النظري المعقد بالأساس."}]},
            {id:12,domain:1,domainName:"المعرفة المهنية",question:"أي من الاستراتيجيات التالية تعتبر الأكثر فاعلية في تثبيت مهارات اتخاذ القرار لدى القياديين؟",options:[{text:"المحاضرة المباشرة طويلة المدة",isCorrect:false,rationale:"المحاضرة تمنح معارف لكنها لا تبني مهارات اتخاذ قرار عملية."},{text:"دراسة الحالة والحوار التفاعلي (Case Study)",isCorrect:true,rationale:"دراسة الحالات الواقعية تضع المتدرب في بيئة محاكاة واختبار البدائل والنتائج."},{text:"القراءة الفردية الصامتة للحقيبة",isCorrect:false,rationale:"لا توفر التفاعل وتعدد الآراء والتغذية الراجعة."},{text:"مشاهدة فيديو توثيقي دون نقاش",isCorrect:false,rationale:"دون نقاش وتحليل يفقد الفيديو قيمته التفاعلية."}]},
            {id:13,domain:1,domainName:"المعرفة المهنية",question:"عند صياغة جدول المحتويات في الحقيبة التدريبية، يُفضل اعتماد الترتيب التالي:",options:[{text:"من المعقد إلى البسيط ومن المجهول إلى المعلوم",isCorrect:false,rationale:"هذا يعقد الفهم ويزيد التشتت في البدايات."},{text:"من البسيط إلى المركب ومن المعلوم إلى المجهول تدريجياً",isCorrect:true,rationale:"التدرج المنطقي يراعي البناء المعرفي التراكمي في ذهن المتدرب."},{text:"عشوائياً حسب رغبة المدرب أثناء الشرح",isCorrect:false,rationale:"المنهجية المنظمة شرط أساسي لنجاح الحقيبة."},{text:"التركيز على التطبيق العملي قبل تقديم المبادئ الأساسية نهائياً",isCorrect:false,rationale:"التطبيق يتطلب الحد الأدنى من المفاهيم التوجيهية أولاً."}]},
            {id:14,domain:1,domainName:"المعرفة المهنية",question:"حسب نظرية الذكاءات المتعددة لـ (هاوارد جاردنر)، المتدرب الذي يتعلم أفضل من خلال المخططات والخرائط الذهنية يمتلك ذكاءً عالية في المجال:",options:[{text:"الذكاء اللغوي الشفهي",isCorrect:false,rationale:"يتعلق بالكلمات والتعبير والخطابة."},{text:"الذكاء البصري - المكاني",isCorrect:true,rationale:"أصحاب الذكاء البصري يستوعبون المعرفة عبر الصور والألوان والتنظيم المكاني."},{text:"الذكاء المنطقي - الرياضي",isCorrect:false,rationale:"يركز على الأرقام والمعادلات والعلاقات السبب والنتيجة."},{text:"الذكاء الجسدي - الحركي",isCorrect:false,rationale:"يتعلم عبر الحركة واللمس وتمثيل الأدوار."}]},
            {id:15,domain:1,domainName:"المعرفة المهنية",question:"أي الجمل التالية توضح شرط التغذية الراجعة (Feedback) الفعالة؟",options:[{text:"أن تكون عامة ومبهمة لحماية مشاعر المتدرب",isCorrect:false,rationale:"التغذية العامة لا تفيد المتدرب في تحديد موقع الخلل للتحسين."},{text:"أن تكون محددة، فورية، وتركز على السلوك والأداء لا الشخص",isCorrect:true,rationale:"التغذية المحددة والمركزة على الأداء تساعد المتدرب على تعديل مساره بمهنية."},{text:"أن تُؤجل إلى نهاية الدورة التدريبية بعد أيام",isCorrect:false,rationale:"التأخير يفقد التغذية الراجعة قيمتها واقترانها بالحدث."},{text:"أن تتضمن النقد الشخصي والسخرية أمام الجميع",isCorrect:false,rationale:"يهدم البيئة الآمنة ويتنافى مع الميثاق الأخلاقي."}]},
            {id:16,domain:1,domainName:"المعرفة المهنية",question:"ماذا يُقصد بمفهوم 'مصفوفة التدريب' (Training Matrix) في إدارة الموارد البشرية؟",options:[{text:"مخطط توزيع مقاعد المتدربين في القاعة",isCorrect:false,rationale:"هذا تصميم القاعة فقط."},{text:"جدول يربط الوظائف بالمهارات والكفايات التدريبية المطلوبة لكل مسمى",isCorrect:true,rationale:"تحدد المصفوفة المهارات المطلوبة للوظائف ودورات التدريب المستهدفة لكل موظف."},{text:"برنامج حاسوبي لحساب مكافآت المدربين",isCorrect:false,rationale:"نظام مالي إداري لا يتصل بالمسار التدريبي المهاراتي."},{text:"قائمة بأبسط الأنشطة السريعة للتعارف",isCorrect:false,rationale:"مصفوفة التدريب تخطيط استراتيجي كلي للرفع من قدرات المنظمة."}]},
            {id:17,domain:1,domainName:"المعرفة المهنية",question:"قاعدة أساسية في جلسات 'العصف الذهني' (Brainstorming) يجب على المدرب الالتزام بها هي:",options:[{text:"نقد وتقييم الأفكار فور طرحها مباشرة",isCorrect:false,rationale:"النقد المبكر يكبح التفكير الإبداعي ويقلل الأفكار."},{text:"فصل مرحلة توليد الأفكار عن مرحلة تقييمها والترحيب بالكم الكثيف",isCorrect:true,rationale:"قاعدة العصف الذهني هي: الكم يجلب الكيف، ويحظر النقد أو التقويم أثناء فترة الجمع."},{text:"السماح فقط لأصحاب الخبرة بالمشاركة",isCorrect:false,rationale:"العصف الذهني يحتاج مشاركة جميع أفراد المجموعة."},{text:"استبعاد الأفكار الغريبة والجديدة فوراً",isCorrect:false,rationale:"الأفكار الغريبة قد تكون نواة لحلول ابتكارية ممتازة."}]},
            {id:18,domain:1,domainName:"المعرفة المهنية",question:"في دلفي (Delphi Technique) المستعملة في تحديد الاحتياجات المستقبلية، يتم جمع الآراء من خلال:",options:[{text:"مواجهة مباشرة وسجال بين الخبراء في طاولة واحدة",isCorrect:false,rationale:"دلفي تتجنب المواجهة المباشرة لمنع تأثير أصحاب النفوذ."},{text:"استبيانات متتابعة وسرية للخبراء دون لقاء مباشر بينهم على جولات",isCorrect:true,rationale:"تضمن التقنية الوصول لإجماع الخبراء بشكل علمي ومستقل دون تحيز أو ضغوط."},{text:"استطلاع رأي عام عبر وسائل التواصل الاجتماعي",isCorrect:false,rationale:"تتطلب استشارة خبراء متخصصين محددين."},{text:"اختبارات سريعة مفاجئة للمتدربين",isCorrect:false,rationale:"دلفي أداة بحث واستشراف وليست اختيارات للمتدربين."}]},
            {id:19,domain:1,domainName:"المعرفة المهنية",question:"أي من مكونات 'الحقيبة التدريبية' يوجّه تحديداً للمتدرب لمساعدته أثناء التطبيق والمراجعة الذاتية؟",options:[{text:"دليل المدرب (Instructor Guide)",isCorrect:false,rationale:"يحتوي إرشادات وإداريات ومفاتيح الحل الخاصة بالمدرب."},{text:"دليل المتدرب / مذكرة المتدرب (Trainee Manual)",isCorrect:true,rationale:"يشمل المادة العلمية والأنشطة والتمارين والمراجع الموجهة للمتدرب."},{text:"العرض التقديمي للشرائح",isCorrect:false,rationale:"أداة عرض مساعدة ملخصة وليست دليلاً شاملاً للقراءة والتطبيقات."},{text:"تقرير التقييم النهائي للدورة",isCorrect:false,rationale:"وثيقة إدارية لمكتب التدريب والجهة المنظمة."}]},
            {id:20,domain:1,domainName:"المعرفة المهنية",question:"المبدأ الذي ينص على أن المتدرب يميل لتكرار السلوك الذي يتبعه مكافأة أو نصر، يتوافق مع قانون:",options:[{text:"قانون الأثر لثورندايك (Law of Effect)",isCorrect:true,rationale:"الاستجابات التي تتبعها نتائج مريحة ومكافأة تميل للثبات والتكرار."},{text:"قانون الحفظ المعرفي",isCorrect:false,rationale:"ليس مصطلحاً قانونياً سلوكياً معتمداً في التعلم."},{text:"مبدأ الإنكار السلوكي",isCorrect:false,rationale:"مصطلح لا يتوافق مع معززات التعلم."},{text:"قانون النسبية النفسية",isCorrect:false,rationale:"لا يمت بصلة لنظريات التعلم الاشتراطي."}]},
            // Domain 2
            {id:21,domain:2,domainName:"الممارسات المهنية",question:"ما التصرف الأمثل للمدرب عندما يطرح متدرب سؤالاً معقداً لا يعرف المدرب إجابته الفورية؟",options:[{text:"اختراع إجابة غير دقيقة للحفاظ على الهيبة أمام القاعة",isCorrect:false,rationale:"يفقد المدرب مصداقيته ويهدم الأمانة العلمية."},{text:"تجاهل السؤال والانتقال لشريحة أخرى فوراً",isCorrect:false,rationale:"يعطي انطباعاً بالتهرب وضعف المهارة في إدارة الحوار."},{text:"الاعتراف بشفافية، وتحويل السؤال للمجموعات أو إرجاء إجابته للبحث للقاء القادم",isCorrect:true,rationale:"سلوك احترافي يعزز الشفافية والبحث الشاركي ويحافظ على مصداقية المدرب."},{text:"توبيخ المتدرب على طرح سؤال خارج النطاق",isCorrect:false,rationale:"يسيء للمتدرب ويخلق بيئة تدريبية عدائية."}]},
            {id:22,domain:2,domainName:"الممارسات المهنية",question:"أي من أنماط تنظيم مقاعد القاعة التدريبية يعتبر الأنسب لورش العمل التفاعلية القائمة على المجموعات الصغيرة؟",options:[{text:"نمط المدرج التقليدي (Auditorium)",isCorrect:false,rationale:"مناسب للمحاضرات العامة والجمهور الكبير دون تفاعل."},{text:"نمط الصفوف المتوازية (School Classroom)",isCorrect:false,rationale:"يدعم الاتصال من طرف واحد (المدرب إلى المتدربين)."},{text:"نمط الطاولات الدائرية / المجموعات (Cabaret / Islands)",isCorrect:true,rationale:"يسهل التواصل البصري والتفاعل والعمل الجماعي بين أعضاء كل مجموعة."},{text:"نمط الممر المغلق",isCorrect:false,rationale:"يعوق حركة المدرب والتواصل البصري بين الأفراد."}]},
            {id:23,domain:2,domainName:"الممارسات المهنية",question:"كيف يتعامل المدرب بمهنية مع متدرب 'مسيطر وثاقب الرأي' يحاول الاحتكار والاستئثار بالحديث دائماً؟",options:[{text:"طرده مباشرة من القاعة التدريبية",isCorrect:false,rationale:"تصرف حاد وغير تربوي يثير التوتر."},{text:"شكر مشاركته، ثم إعادة توجيه الحديث بلطف لبقية المتدربين مع استخدام وقت محدد بالعادة",isCorrect:true,rationale:"إدارة الوقت والفرص بذكاء ولطافة دون جرح المتدرب وبمنح الآخرين فرصة المشاركة."},{text:"تجاهله التام وعدم النظر إليه أبداً",isCorrect:false,rationale:"قد يستفزه لمزيد من المقاطعات والتشويش."},{text:"الدخول معه في جدال حاد لإثبات خطأ رأيه",isCorrect:false,rationale:"يحول الجلسة إلى صراع شخصي يخرج الدورة عن أهدافها."}]},
            {id:24,domain:2,domainName:"الممارسات المهنية",question:"عند استخدام العروض التقديمية (PowerPoint)، ما القاعدة الذهبية لضمان الاستيعاب البصري للشرائح؟",options:[{text:"ملء الشريحة بفقرات طويلة جداً من الكتاب",isCorrect:false,rationale:"تسبب إجهاداً بصرياً وتجعل المتدرب يقرأ بدلاً من الاستماع."},{text:"استخدام قاعدة (6×6) أو الشفافية، وموجز النقاط المختصرة مع التباين الجيد",isCorrect:true,rationale:"الشرائح المبتكرة تحتوي نقاطاً مفتاحية قليلة ورسومات معبرة لدعم الحديث العرضي."},{text:"وضع حركة وتأثيرات صوتية مزعجة مع كل كلمة",isCorrect:false,rationale:"تشتت الانتباه وتفقد العرض جديته واحترافيته."},{text:"استخدام ألوان خطوط باهتة متقاربة مع خلفية الشريحة",isCorrect:false,rationale:"تضعف الرؤية والقراءة من المسافات البعيدة."}]},
            {id:25,domain:2,domainName:"الممارسات المهنية",question:"أي العناصر التالية في لغة الجسد يُعزز الألفة والثقة بين المدرب والمتدربين بدرجة أكبر؟",options:[{text:"الوقوف بثبات مع مكتوف اليدين والنظر للسقف",isCorrect:false,rationale:"يعكس الحظر والتعالي وضعف التواصل."},{text:"التواصل البصري المتوازن (Eye Contact) والابتسامة وحركة اليدين المفتوحة",isCorrect:true,rationale:"التواصل البصري الشامل يشعر كل متدرب بالاهتمام والترحيب والأمان."},{text:"المشي السريع والمستمر عبر القاعة دون توقف",isCorrect:false,rationale:"يسبب القلق والتشتت البصري للمستمعين."},{text:"الإشارة بالإصبع المباشر الشديد نحو وجوه الحاضرين",isCorrect:false,rationale:"سلوك اتهامي يثير الدفاعية لدى المتدرب."}]},
            {id:26,domain:2,domainName:"الممارسات المهنية",question:"ما الإجراء الصحيح الذي يتخذه المدرب عند قيادة تمرين 'لعب الأدوار' (Role Playing)؟",options:[{text:"ترك المتدربين يؤدون الدور دون إحاطتهم بالسيناريو أو الهدف",isCorrect:false,rationale:"يؤدي للعشوائية والخروج عن هدف المهارة."},{text:"تحديد الأهداف، وتوزيع الأدوار بوضوح، مع إجراء التعقيب والتأمل (Debriefing) بعد التمرين",isCorrect:true,rationale:"التعقيب واستخلاص الدروس (Debriefing) هو المرحلة الأكثر أهمية لتحويل التمثيل لتعلم حقيقي."},{text:"إنهاء الدورة فور نجاح التمثيل دون مناقشة النتائج",isCorrect:false,rationale:"يفقد التمرين قيمته التدريبية والتعليمية."},{text:"إجبار متدرب خجول جداً بالقوة على لعب دور بطولي معقد",isCorrect:false,rationale:"قد يسبب حرجاً شديداً وعزوفاً عن المشاركة المستقبلي."}]},
            {id:27,domain:2,domainName:"الممارسات المهنية",question:"في بداية الجلسة الأولى لبرنامج تدريبي، أي المهام التالية يجب على المدرب البدء بها بعد التعارف؟",options:[{text:"شرح المادة المعقدة فوراً لربح الوقت",isCorrect:false,rationale:"يتجاهل التهيئة النفسية وتوضيح التوقعات والاتفاقات."},{text:"بناء قواعد العمل (Ground Rules) واستعراض أهداف وتوقعات البرنامج",isCorrect:true,rationale:"الاتفاق على القواعد (كالمواعيد والهواتف) والتوقعات يمنح الجلسة انضباطاً وشفافية."},{text:"إجراء الاختبار الختامي للدورة",isCorrect:false,rationale:"الاختبار الختامي مكانه النهاية لقياس المخرجات."},{text:"توزيع شهادات الحضور مباشرة",isCorrect:false,rationale:"الشهادات تُعطى بعد التحقق من استيفاء متطلبات الحضور والتقويم."}]},
            {id:28,domain:2,domainName:"الممارسات المهنية",question:"ما معنى استخدام مهارة 'تعديل نبرة الصوت وتناغم السرعة' (Pacing & Pitch) لدى المدرب؟",options:[{text:"التحدث بنبرة واحدة ثابتة ورتيبة طول اليوم",isCorrect:false,rationale:"تسبب السأم والنعاس لدى المتدربين."},{text:"تغيير النبرة والسرعة وشدة الصوت بما يتناسب مع أهمية النقطة والحالة العاطفية",isCorrect:true,rationale:"التنوع الصوتي (Vocal Variety) يجذب الانتباه ويؤكد على الأفكار الرئيسة ويطرد الملل."},{text:"الصراخ المستمر بأعلى صوت طوال الجلسة",isCorrect:false,rationale:"يسبب إجهاداً للمدرب وإزعاجاً كبيراً للحاضرين."},{text:"الهمس الضعيف الذي لا يكاد يُسمع في الصفوف الخلفية",isCorrect:false,rationale:"يعيق وصول المعلومة ويشتت انتباه القاعة."}]},
            {id:29,domain:2,domainName:"الممارسات المهنية",question:"حدث عطل تقني مفاجئ وانقطع انقطاعاً كاملاً أجهزة العرض (Projector)، ما التصرف المهني المرن للمدرب؟",options:[{text:"إلغاء الجلسة والاعتذار والانصراف فوراً",isCorrect:false,rationale:"ضعف بالجاهزية والمرونة والسيطرة على الأزمات."},{text:"الانتقال للبدائل كالسبورة الورقية (Flipchart) والنقاش التفاعلي بدعم مذكرة المتدرب",isCorrect:true,rationale:"المدرب المحترف يمتلك دائماً خطة طوارئ (Plan B) ولا يتوقف تعليمه على التقنية فقط."},{text:"الصراخ على فني الصيانات والانتظار لساعات",isCorrect:false,rationale:"يهدر الوقت ويفقد المدرب رباطة جأشه."},{text:"قراءة النص حرفياً من شاشة هاتفه دون إشراك المتدربين",isCorrect:false,rationale:"أسلوب ممل لا يراعي تفاعل المتدربين."}]},
            {id:30,domain:2,domainName:"الممارسات المهنية",question:"ما الهدف الأساسي من إجراء 'التعقيب واستخلاص الدروس' (Debriefing) عقب انتهائك من أي نشاط تدريبي؟",options:[{text:"ملء وقت فراغ الجلسة",isCorrect:false,rationale:"هدف ثانوي وغير مهني."},{text:"مساعدة المتدربين على ربط تجربة النشاط بالمعارف النظرية والتطبيقات الواقعية",isCorrect:true,rationale:"الـ Debriefing يحول النشاط من مجرد لعبة أو مرح إلى خبرة تعلم عميقة ومستدامة."},{text:"تحديد الفائزين وإعطائهم جوائز فقط",isCorrect:false,rationale:"المكافأة جانب تحفيزي، أما الفائدة الحقيقية فهي استخلاص التعلم."},{text:"إظهار الأخطاء والتسلية بها",isCorrect:false,rationale:"يتنافى مع الأخلاقيات وخلق البيئة الآمنة."}]},
            {id:31,domain:2,domainName:"الممارسات المهنية",question:"كيف يتأكد المدرب من استيعاب المتدربين لخطوات مهارة عملية معقدة قبل الانتقال للتطبيق؟",options:[{text:"سؤالهم فقط 'هل فهمتم؟' وانتظار هز الرؤوس",isCorrect:false,rationale:"إجابة نعم لا تعني بالضرورة الفهم والاستيعاب الفعلي."},{text:"إعادة شرح النظريات من جديد من بداية اليوم",isCorrect:false,rationale:"تكرار إهداري للوقت دون قياس للأداء."},{text:"طلب تقديم نموذج أداء توضيحي (Demonstration) أو سؤالهم تشخيصياً عن الخطوة",isCorrect:true,rationale:"العرض التوضيحي المتبادل والأسئلة الموجهة تكشف الفجوات فوراً."},{text:"الانتقال فوراً دون أي تقييم مرحلي",isCorrect:false,rationale:"قد يؤدي إلى تراكم الأخطاء أثناء الممارسة العملية."}]},
            {id:32,domain:2,domainName:"الممارسات المهنية",question:"ما التصرف المناسب تجاه متدرب صامت وخجول جداً لا يشارك في النقاشات العامة؟",options:[{text:"إحراجه بالسؤال المباشر المفاجئ أمام الجميع بأسئلة معقدة",isCorrect:false,rationale:"يزيد من انغلاقه وخوفه من المشاركة."},{text:"تشجيعه في المجموعات الصغيرة أولاً، وطرح أسئلة مفتوحة سهلة تناسب اهتماماته",isCorrect:true,rationale:"التدرج من المجموعات الصغيرة يقلل من رهبة الحديث أمام الجمهور وبناء الثقة تدريجياً."},{text:"تجاهل وجوده بالكلية وعدم إشراكه نهائياً",isCorrect:false,rationale:"يحرمه من حق التعلم والتطوير."},{text:"خصم نقاط حضوره بسبب الصمت",isCorrect:false,rationale:"الخجل طبيعة شخصية تحتاج معالجة تدريبية لا عقاباً."}]},
            {id:33,domain:2,domainName:"الممارسات المهنية",question:"عند توجيه سؤال للقاعة، ما طول 'زمن الانتظار' (Wait Time) الموصى به علمياً قبل تلقي الإجابات؟",options:[{text:"صفر ثانية (الإجابة فوراً أو إعطاؤها للغير)",isCorrect:false,rationale:"لا يمنح فرصة للمعالجة الذهنية العميقة."},{text:"من 3 إلى 5 ثوانٍ على الأقل لإتاحة التفكير والتجهيز",isCorrect:true,rationale:"زمن الانتظار يزيد من جودة وتنوع الإجابات ويشجع الفئات الخجولة."},{text:"15 دقيقة صمت تام",isCorrect:false,rationale:"وقت طويل جداً يسبب الركود وتشتت القاعة."},{text:"الإجابة عن السؤال بواسطة المدرب نفسه فور طرحه مباشرة",isCorrect:false,rationale:"يلغي دور المتدربين ويحوله إلى ملقن."}]},
            {id:34,domain:2,domainName:"الممارسات المهنية",question:"أثناء إدارة النقاش، يميل بعض المتدربين إلى الخروج عن موضوع الجلسة الأساسي. الممارسة الأفضل هي:",options:[{text:"مسايرتهم والخروج التام عن الجدول لإنهاء اليوم",isCorrect:false,rationale:"يؤدي لإخفاق البرنامج في تحقيق أهدافه المخططة."},{text:"تأطير الحديث بلطف، وتدوين النقطة الخارجة في 'مواقف السيارات / الحاضنة' (Parking Lot)",isCorrect:true,rationale:"أداة Parking Lot تحافظ على تقدير فكرة المتدرب مع بقاء الجلسة في مسارها المحدد."},{text:"الاستهزاء بالمتدرب الذي خرج عن الموضوع",isCorrect:false,rationale:"يدمر العلاقة التدريبية والبيئة الآمنة."},{text:"إنهاء الدورة فوراً",isCorrect:false,rationale:"قرار غير متناسب بالكلية."}]},
            {id:35,domain:2,domainName:"الممارسات المهنية",question:"ما الفائدة الرئيسة من تقسيم وقت الجلسة التدريبية وفق قاعدة (20-70-10) تقريباً؟",options:[{text:"جعل 70% للشرح النظري المباشر للمدرب",isCorrect:false,rationale:"يتعارض مع مبادئ التعلم النشط وتدريب الراشدين."},{text:"تخصيص 70% للتطبيقات والأنشطة المباشرة، مع تقديم ومراجعة متوازنة",isCorrect:true,rationale:"يعزز التركيز على مهارة الممارسة والمشاركة النشطة من قبل المتدربين."},{text:"تخصيص 70% للاستراحات وتناول الوجبات",isCorrect:false,rationale:"إهدار لوقت البرنامج وأهدافه."},{text:"الاعتماد على التقويم الختامي بـ 70% من الوقت",isCorrect:false,rationale:"التقويم جزء مرحلي وخاتمي ولا يستغرق معظم وقت البرنامج."}]},
            {id:36,domain:2,domainName:"الممارسات المهنية",question:"أهم ميزة لأداة الاستبيانات الرقمية الفورية (مثل Kahoot أو Mentimeter) أثناء تنفيذ التدريب هي:",options:[{text:"تعويض نقص المادة العلمية لدى المدرب",isCorrect:false,rationale:"الأداة لا تعوض المحتوى الضعيف."},{text:"زيادة التفاعل، وقياس استيعاب القاعة لحظياً، والتنوع والتشويق",isCorrect:true,rationale:"تمنح التفاعل وإظهار النتائج لحظياً بالرسوم البيانية وتنشيط الجلسة."},{text:"تجميع أرقام هواتف المتدربين لغرض الإعلانات",isCorrect:false,rationale:"ليس هدفاً تدريبياً ويتعارض مع الخصوصية."},{text:"إلغاء الحاجة لوجود المدرب داخل القاعة",isCorrect:false,rationale:"التقنية أداة مساعدة في يد المدرب وليست بديلاً عنه."}]},
            {id:37,domain:2,domainName:"الممارسات المهنية",question:"ما المقصود بـ 'التيسير' (Facilitation) في الممارسة التدريبية الاحترافية؟",options:[{text:"إلقاء المحاضرات والتلقين من طرف واحد دون مشاركة",isCorrect:false,rationale:"هذا هو التعليم الإلقائي التقليدي."},{text:"مساعدة المتدربين على اكتشاف المعرفة والوصول للحلول بأنفسهم عبر أساليب تفاعلية",isCorrect:true,rationale:"المدرب الميسر يوجه النقاش ويرشد العمليات ليجعل التفكير والإنتاج لدى المتدربين."},{text:"التساهل في التقييم وإعطاء الجميع الدرجات دون قياس",isCorrect:false,rationale:"خلط بين التيسير التدريبي والتساهل غير المهني."},{text:"تقليل وقت البرنامج للإنهاء السريع",isCorrect:false,rationale:"التيسير يتعلق بمنهجية إشراك العقول وتوجيه التعلم."}]},
            {id:38,domain:2,domainName:"الممارسات المهنية",question:"كيف يضمن المدرب التوزيع العادل للمشاركات بين المجموعات داخل القاعة؟",options:[{text:"السماح دائماً لنفس المجموعة السريعة بالإجابة في كل مرة",isCorrect:false,rationale:"يؤدي لإحباط وتهميش باقي المجموعات."},{text:"تطبيق التدوير المنتظم، ورؤساء المجموعات، والاستدعاء العشوائي المنظم للمشاركات",isCorrect:true,rationale:"يضمن إتاحة فرص متساوية وتنوع الآراء والتفاعل من كافة الطاولات."},{text:"عدم إعطاء أي فرصة لأي مجموعة للحديث",isCorrect:false,rationale:"يحول التدريب لنظام التلقين الجاف."},{text:"اختيار المتدربين بناءً على المظهر الخارجي",isCorrect:false,rationale:"تميز غير موضوعي يتنافى مع ميثاق المهنة."}]},
            {id:39,domain:2,domainName:"الممارسات المهنية",question:"إذا لاحظ المدرب هبوطاً حاداً في طاقة وانتباه المتدربين بعد فترة الغداء، التصرف الأنسب هو:",options:[{text:"زيادة كمية المحتوى النظري الجاف للتسريع",isCorrect:false,rationale:"سيزيد من الاستغراق في النوم والتشتت."},{text:"تنفيذ نشاط تنشيطي حركي قصير (Energy Booster) أو أداء تمرين تفاعلي",isCorrect:true,rationale:"الأنشطة التنشيطية تعيد تدفق الدم وتجدد الطاقة الذهنية والتركيز."},{text:"الصراخ في القاعة لتنبيههم",isCorrect:false,rationale:"تصرف ينفر الحضور ولا يعالج الانخفاض الفسيولوجي للطاقة."},{text:"إلغاء بقية اليوم التدريبي فوراً",isCorrect:false,rationale:"إضرار بخطة الدورة والساعات المعتمدة."}]},
            {id:40,domain:2,domainName:"الممارسات المهنية",question:"في ختام الدورة التدريبية، الأسلوب الأمثل لإنهاء اليوم الأخير هو:",options:[{text:"المغادرة الخاطفة بمجرد انتهاء الشريحة الأخيرة",isCorrect:false,rationale:"يترك نهايات مفتوحة وغير مهنية."},{text:"مراجعة تلخيصية للمحاور، وربطها بخطط التطبيق الشخصية، وتقديم التقييم والتغذية الراجعة",isCorrect:true,rationale:"الختام الاحترافي يلخص التعلم ويساعد المتدرب على وضع خطة عمل لتطبيق ما تعلمه في وظيفته."},{text:"فتح باب الجدال السياسي والفكري",isCorrect:false,rationale:"يخرج الدورة عن هدفها ويسبب حساسية."},{text:"الطلب من المتدربين إعادة تقديم الدورة كاملة",isCorrect:false,rationale:"غير منطقي ولا يتماشى مع الوقت المتبقي."}]},
            // Domain 3
            {id:41,domain:3,domainName:"القيم والمسؤوليات المهنية",question:"قام مدرب بنقل حقيبة تدريبية كاملة أعدها زميل آخر ونسبها لنفسه دون إذن أو إشارة للمصدر. هذا التصرف يعد انتهاكاً لـ:",options:[{text:"قواعد الأمن والسلامة في القاعة",isCorrect:false,rationale:"لا يتعلق بسلامة القاعة المادية."},{text:"الأمانة العلمية وحقوق الملكية الفكرية وميثاق أخلاقيات التدريب",isCorrect:true,rationale:"نسبة جهد الآخرين للذات سرقة علمية وتجاوز لأخلاقيات الممارسة المهنية."},{text:"إدارة الوقت والجدول الزمني",isCorrect:false,rationale:"لا يمت بصلة لتوزيع أوقات الجلسات."},{text:"معايير التقييم التشخيصي",isCorrect:false,rationale:"لا يتصل بأساليب التقييم."}]},
            {id:42,domain:3,domainName:"القيم والمسؤوليات المهنية",question:"أي من المواقف التالية يُجسد النزاهة والعدالة لدى المدرب أثناء تقييم المتدربين؟",options:[{text:"منح درجات عالية لأحد المتدربين بسبب صلة قرابة شخصية",isCorrect:false,rationale:"تضارب مصالح وانحياز يخل بالعدالة."},{text:"تقييم جميع المتدربين بناءً على معايير موضوعية معلنة وموحدة للجميع دون تمييز",isCorrect:true,rationale:"العدالة والموضوعية تضمن تكافؤ الفرص وحيادية التقويم وفق مؤشرات أداء موثوقة."},{text:"تخفيض درجات المتدربين الذين يطرحون أسئلة ذكية",isCorrect:false,rationale:"عقاب تعسفي يقتل التفكير النقدي."},{text:"تسريب أسئلة التقييم النهائي لبعض الأفراد دون الآخرين",isCorrect:false,rationale:"فساد مهني وإخلال بشفافية الاختبار."}]},
            {id:43,domain:3,domainName:"القيم والمسؤوليات المهنية",question:"إذا اكتشف المدرب وجود 'تضارب مصالح' (Conflict of Interest) بين دوره كمدرب ومصلحة شخصية في تقييم عقد تدريبي، التصرف الأخلاقي هو:",options:[{text:"إخفاء الأمر والمضي قدماً لتحقيق مكاسب شخصية",isCorrect:false,rationale:"سلوك غير أخلاقي يعرض المدرب للمساءلة."},{text:"الإفصاح الشفاف للجهة المعنية والتنحي أو اتخاذ الإجراء المنظم المعتمد",isCorrect:true,rationale:"الإفصاح والشفافية معيار أساسي للنزاهة وتجنب شبهة الفساد والاستغلال."},{text:"الطلب من المتدربين التكتم على الموضوع",isCorrect:false,rationale:"يزيد من الشبهة ويضر بالمصداقية."},{text:"اتهام الآخرين بتعطيل عمله",isCorrect:false,rationale:"هروب من المسئولية الأخلاقية."}]},
            {id:44,domain:3,domainName:"القيم والمسؤوليات المهنية",question:"أي التصرفات التالية يعكس احترام المدرب للتنوع الثقافي والاجتماعي بين المتدربين؟",options:[{text:"السخرية من لهجة أو خلفية بعض المشاركين",isCorrect:false,rationale:"سلوك تنمري مرفوض يخرق القوانين والأخلاق."},{text:"استخدام لغة وأمثلة متوازنة وشاملة تحترم جميع الثقافات وتمنع التمييز",isCorrect:true,rationale:"يقوم التدريب الاحترافي على دمج الجميع وخلق بيئة تقبل وتنوع ثرية."},{text:"فرض رؤيته الثقافية الشخصية بالقوة كمرجع وحيد",isCorrect:false,rationale:"يتعارض مع الانفتاح ومرونة المدرب."},{text:"تقسيم المتدربين في القاعة بناءً على الانتماءات القبلية أو المناطقية",isCorrect:false,rationale:"يغذي التعصب المرفوض ويضر بالتكتل الإيجابي."}]},
            {id:45,domain:3,domainName:"القيم والمسؤوليات المهنية",question:"التطوير المهني المستمر للمدرب (CPD) يتطلب منه بشكل أساسي:",options:[{text:"الاكتفاء بما تعلمه في سنوات شبابه الأولى",isCorrect:false,rationale:"يؤدي لتقادم المعرفة والعزل عن التطورات الحديثة."},{text:"التأمل الذاتي، ومواكبة المستجدات، وحضور البرامج وقراءة الأبحاث واستطلاع التغذية الراجعة",isCorrect:true,rationale:"النمو المهني عملية مستمرة ترفع كفاءة التخطيط والتنفيذ لدى المدرب."},{text:"رفض تقييم المتدربين وملاحظات المسئولين",isCorrect:false,rationale:"يعيق اكتشاف نقاط التحسين والتطور."},{text:"تكرار نفس الشفافية والمحتوى لمدة 20 سنة دون تعديل",isCorrect:false,rationale:"يؤدي إلى فقدان الشغف ومواكبة الحداثة."}]},
            {id:46,domain:3,domainName:"القيم والمسؤوليات المهنية",question:"كيف يحافظ المدرب على سرية المعلومات (Confidentiality) الخاصة بالمنظمة المتدربة؟",options:[{text:"نشر المشكلات الداخلية والبيانات المالية للشركة على وسائل التواصل للتعليم",isCorrect:false,rationale:"خرق صريح للسرية والاتفاقيات الأمنية للمنظمة."},{text:"عدم إفشاء أي بيانات أو حالة عمل حصرية إلا بإذن كتابي صريح واستخدام أمثلة عامة مجردة",isCorrect:true,rationale:"حماية أسرار العميل والشركة الموجهة جزء أساسي من عقود التدريب المهني."},{text:"بيع هذه البيانات لشركات منافسة",isCorrect:false,rationale:"جريمة إلكترونية ومهنية شنيعة."},{text:"تداول الأسماء الحقيقية للمتدربين في جلسات شخصية خروجاً عن القاعة",isCorrect:false,rationale:"ينتهك سرية الأشخاص والمنظمات."}]},
            {id:47,domain:3,domainName:"القيم والمسؤوليات المهنية",question:"عندما يلاحظ المدرب وجود حالة خاصة لمتدرب من أصحاب الإعاقة الحركة أو البصرية، الواجب المهني الأخلاقي هو:",options:[{text:"تجاهل الحالة وطلب منه التكيف بنفسه",isCorrect:false,rationale:"يتنافى مع إتاحة الوصول والمساواة."},{text:"توفير التسهيلات المعقولة (Accessibility) وتكييف الوسائل لضمان اندماجه الكامل",isCorrect:true,rationale:"المعيار الشامل للحقوق يضمن إتاحة أدوات التدريب والبيئة المكانية للجميع."},{text:"طلب استبعاده من الدورة التدريبية",isCorrect:false,rationale:"تمييز مرفوض وانتهاك لحقوق الإنسان والتعليم."},{text:"إعطاؤه الشهادة فوراً دون أن يحضر الجلسات",isCorrect:false,rationale:"يعيق اكتساب المهارة الحقيقية ويخل بالعدالة."}]},
            {id:48,domain:3,domainName:"القيم والمسؤوليات المهنية",question:"السلوك الاحترافي المعبّر عن 'تقبل التغذية الراجعة والتقييم' لدى المدرب بعد نهاية البرنامج هو:",options:[{text:"الغضب وتوبيخ المتدربين الذين وضعوا تقييماً منخفضاً",isCorrect:false,rationale:"يعكس عدم نضج مهني وضعف في الذكاء العاطفي."},{text:"تحليل ملاحظات التقييم بموضوعية واستثمارها كفرص للتحسين والتطوير المستقبلي",isCorrect:true,rationale:"المدرب الناجح ينظر للتقييم المنخفض كبوصلة لتحديث أساليبه ومادته."},{text:"إلغاء أوراق التقييم وتمزيقها",isCorrect:false,rationale:"سلوك غير مسؤول يحرم المنظمة من فرص التحسين."},{text:"رفع دعوى ضد مركز التدريب",isCorrect:false,rationale:"تصرف غير متزن في التعامل مع آراء التقييم."}]},
            {id:49,domain:3,domainName:"القيم والمسؤوليات المهنية",question:"إبراز المدرب لسيرته الذاتية ومؤهلاته العلمية يتطلب الالتزام بـ:",options:[{text:"تضخيم الخبرات وادعاء الحصول على شهادات غير حقيقية لجذب العقود",isCorrect:false,rationale:"تزوير واحتيال يهدد السمعة والمهنة."},{text:"المصداقية والشفافية والدقة التامة في عرض المؤهلات والخبرات دون مبالغة",isCorrect:true,rationale:"المصداقية والنزاهة أساس بناء السمعة المهنية المستدامة."},{text:"إخفاء جميع الشهادات بالكامل",isCorrect:false,rationale:"من حق العميل الاطلاع على مؤهلات المدرب المعتمدة."},{text:"شراء ألقاب وهمية من جهات غير معتمدة واستخدامها",isCorrect:false,rationale:"يضر بالممارسة المهنية ويعرض للمساءلة."}]},
            {id:50,domain:3,domainName:"القيم والمسؤوليات المهنية",question:"كيف يمارس المدرب القدوة والنمذجة الإيجابية (Positive Role Modeling) داخل البيئة التدريبية؟",options:[{text:"التأخر عن مواعيد الجلسة بينما يطالب المتدربين بالانضباط",isCorrect:false,rationale:"تناقض يضعف مصداقية كلامه."},{text:"الالتزام التام بالمواعيد، وحسن الاصغاء، وتجسيد السلوكيات المهنية التي يدعو إليها",isCorrect:true,rationale:"السلوك الملاحظ أعلى صوتاً من الكلام الشفهي، والقدوة هي المحرك الفعلي للاقتداء."},{text:"استخدام الهاتف في التصفح أثناء مشاركات المتدربين",isCorrect:false,rationale:"عدم احترام للحاضرين وقلة اهتمام."},{text:"استغلال القاعة للترويج لمنتجات تجارية شخصية غير مرخصة",isCorrect:false,rationale:"استغلال غير مشروع للبيئة التدريبية."}]},
            {id:51,domain:3,domainName:"القيم والمسؤوليات المهنية",question:"تُعرف 'الرقابة الذاتية' للمدرب بأنها:",options:[{text:"الخوف فقط من عقوبات إدارة المركز التدريبي",isCorrect:false,rationale:"هذا دافع خارجي مؤقت وليس رقابة ذاتية."},{text:"الالتزام الداخلي الصادق بالمعايير الأخلاقية والجودة حتى في غياب الرقابة الخارجية",isCorrect:true,rationale:"الضمير المهني الداخلي يضمن تقديم أقصى جودة وشفافية في كل الظروف."},{text:"الامتناع عن الحديث خوفاً من الأخطاء",isCorrect:false,rationale:"يعيق التفاعل وشرح المحتوى."},{text:"تسجيل مقاطع الفيديو لنفسه ومراجعتها فقط",isCorrect:false,rationale:"هذه أداة تقويم ذاتي وليست المفهوم الشامل للرقابة الذاتية."}]},
            {id:52,domain:3,domainName:"القيم والمسؤوليات المهنية",question:"عند تصميم الأنشطة التدريبية التي تتطلب مجهوداً حركياً، مسئولية المدرب تجاه سلامة المتدربين تشمل:",options:[{text:"تجاهل المخاطر وترك المتدربين يجربون دون إرشاد",isCorrect:false,rationale:"تعريض مباشر لأخطار الإصابات."},{text:"تقييم البيئة الفيزيائية، والتأكد من خلو المساحة من المخاطر وتقديم تعليمات سلامة صريحة",isCorrect:true,rationale:"السلامة الجسدية والنفسية ركن أساسي قبل البدء بأي تطبيق حركي أو خارجي."},{text:"إلزام كبار السن والمصابين بالقيام بنفس القفزات المعقدة",isCorrect:false,rationale:"عدم مراعاة للحالات الصحية والقدرات الفردية."},{text:"توفير ألعاب خطرة لإصابة بعضهم بذهول للتسلية",isCorrect:false,rationale:"تصرف خطير ومجرم أخلاقياً وقانونياً."}]},
            {id:53,domain:3,domainName:"القيم والمسؤوليات المهنية",question:"شهد المدرب وقوع حادثة خرق للسلامة أو مضايقة بين متدربين داخل القاعة. الإجراء الأخلاقي الفوري هو:",options:[{text:"التكتم الكامل والتظاهر بعدم رؤية شيء",isCorrect:false,rationale:"تهاون وسماح بتفاقم الضرر النفسي أو الجسدي."},{text:"التدخل الفوري لضبط القاعة لحماية الضحية، والتعامل مع الموقف وفق الأنظمة المعتمدة",isCorrect:true,rationale:"المدرب مسؤول عن ضبط البيئة التدريبية وحفظ الأمن والسلامة والاحترام لجميع الأطراف."},{text:"تشجيع المتدربين على الاشتباك لحسم الأمر",isCorrect:false,rationale:"سلوك غير أخلاقي بالكلية."},{text:"تصوير المشهد ونشره فوراً",isCorrect:false,rationale:"خرق جسيم للخصوصية والنظام."}]},
            {id:54,domain:3,domainName:"القيم والمسؤوليات المهنية",question:"عند طلب جهة معينة تنفيذ برنامج تدريبي يتضح للمدرب بعد التحليل أن التدريب ليس الحل المناسب للمشكلة، فإن المسئولية المهنية تقتضي:",options:[{text:"الموافقة فوراً للحصول على العائد المالي بغض النظر عن الفائدة",isCorrect:false,rationale:"تغليب المصالح المادية على النزاهة والمستشارية الصادقة."},{text:"توضيح ذلك بصدق للعميل وتقديم النصيحة الاستشارية بأن الحل قد يكون إدارياً أو إجرائياً",isCorrect:true,rationale:"المدرب المستشار يمارس النزاهة ويوفر على العميل هدر الأموال في حلول غير مناسبة."},{text:"تقديم برنامج معقد جداً لإرباكهم",isCorrect:false,rationale:"سلوك غير مهني ولا يحل الفجوة."},{text:"انسحاب بدون تقديم أي توضيح",isCorrect:false,rationale:"قطع التواصل دون تقديم القيمة الاستشارية المتوقعة."}]},
            {id:55,domain:3,domainName:"القيم والمسؤوليات المهنية",question:"العلاقة المهنية بين المدرب والمتدرب يجب أن تُبنى على نطاق الحدود المهنية وتتجنب:",options:[{text:"الاحترام المتبادل والدعم المهاراتي",isCorrect:false,rationale:"هذا أساس العلاقة الصحية المطلوب."},{text:"الانخراط في علاقات استغلالية أو مصلحية تؤثر على حيادية التقييم والعدالة",isCorrect:true,rationale:"المحافظة على الحدود المهنية تضمن تكافؤ الفرص وعدم الانحياز."},{text:"تقديم التغذية الراجعة البناءة",isCorrect:false,rationale:"جزء أساسي من الممارسة التطويرية."},{text:"تشجيع التعلم الذاتي المستمر",isCorrect:false,rationale:"هدف رائد لجميع المناهج الحديثة."}]},
            {id:56,domain:3,domainName:"القيم والمسؤوليات المهنية",question:"أي الممارسات التالية تعتبر تدعيماً للعمل الاستدامي وحماية البيئة في التدريب؟",options:[{text:"طباعة آلاف الأوراق دون استخدامها وإلقائها في القمامة",isCorrect:false,rationale:"هدر للموارد وسلوك غير صديق للبيئة."},{text:"التحول نحو الحقائب الرقمية واستخدام الشاشات الإلكترونية والتقليل من المطبوعات الورقية",isCorrect:true,rationale:"يدعم الممارسات الخضراء والاستدامة وتوفير التكاليف وحفظ البيئة."},{text:"ترك الإضاءة والمكيفات تعمل طوال الليل دون حاجة",isCorrect:false,rationale:"استنزاف للطاقة دون مبرر."},{text:"رفض استخدام التقنية الإلكترونية إطلاقاً",isCorrect:false,rationale:"يقلل العائد ويزيد الهدر المادي والورقي."}]},
            {id:57,domain:3,domainName:"القيم والمسؤوليات المهنية",question:"ما الدور المتوقع من المدرب تجاه مجتمعه المهني والزملاء الجدد؟",options:[{text:"احتكار الخبرة ومنع أي مدرب مبتدئ من التعلم أو الاطلاع على تجاربه",isCorrect:false,rationale:"سلوك سلبي يضعف نمو المجتمع التدريبي."},{text:"مشاركة المعرفة، ونقل الخبرات، وإرشاد المدربين المبتدئين (Mentoring) لبناء قدرات المجتمع",isCorrect:true,rationale:"المسئولية المجتمعية والمهنية تتطلب نقل الخبرة وتمكين الأجيال القادمة."},{text:"محاربة أي مدرب جديد ونشر الشائعات عنه",isCorrect:false,rationale:"سلوك غير أخلاقي يهدم بيئة العمل."},{text:"رفع أسعار التدريب لمنع الآخرين من المنافسة",isCorrect:false,rationale:"ممارسات احتكارية لا تتصل بالجودة المهنية."}]},
            {id:58,domain:3,domainName:"القيم والمسؤوليات المهنية",question:"إذا تعارضت الآراء الفكرية والدينية لشخصية المدرب مع موضوع عام يطرحه أحد المتدربين، الأسلوب المهني هو:",options:[{text:"الهجوم على الشخص والإساءة لمعتقداته",isCorrect:false,rationale:"ينتهك أخلاقيات الاحترام والحياد المهني."},{text:"إدارة الحوار بالحياد، والتركيز على المحتوى العلمي والتخصصي للدورة بعيداً عن الجدل العقائدي",isCorrect:true,rationale:"المدرب المهني يحافظ على حيادية المنبر التدريبي والتركيز على الأهداف التخصصية."},{text:"طرد المتدرب فوراً",isCorrect:false,rationale:"تعسف وضرر بالبيئة التعلمية."},{text:"تحويل التدريب لمناظرة شخصية طوال اليوم",isCorrect:false,rationale:"هدر لوقت وأهداف المشاركين الآخرين."}]},
            {id:59,domain:3,domainName:"القيم والمسؤوليات المهنية",question:"احترام سياسات وأنظمة الجهة الراعية للتدريب يتطلب من المدرب:",options:[{text:"تجاهل الأنظمة وتطبيق ما يراه هو فقط دون أخذ الإذن",isCorrect:false,rationale:"يعرض البرامج للمشاكل النظامية والإدارية."},{text:"الاطلاع على لوائح الجهة، والالتزام بأوقاتها وسياسات الأمن والسلامة وإجراءات التوثيق",isCorrect:true,rationale:"الاحترافية تقتضي الامتثال للوائح المؤسسية المنظمة للعمل."},{text:"تحريض المتدربين على مخالفة قوانين المنظمة",isCorrect:false,rationale:"سلوك تخريبي يتنافى مع أمانة المهنة."},{text:"تغيير مكان الدورة ودون علم الجهة المنظمة",isCorrect:false,rationale:"إخلال جسيم بالعقد وتوفير التجهيزات."}]},
            {id:60,domain:3,domainName:"القيم والمسؤوليات المهنية",question:"تكتمل القيمة المهنية للتدريب عندما ينعكس أثر التعلم على:",options:[{text:"حصول المدرب على مستحقاته المالية فقط",isCorrect:false,rationale:"هدف شخصي لا يعكس القيمة التدريبية الحقيقية."},{text:"تحسين أداء المتدرب، وتطوير بيئة العمل، وتحقيق القيمة المضافة للمجتمع والمؤسسة",isCorrect:true,rationale:"الغاية السامية للتدريب هي التغيير الإيجابي والتنمية المستدامة للأفراد والمؤسسات."},{text:"التقاط الصور التذكارية ونشرها في المنصات فقط",isCorrect:false,rationale:"مظهر خارجي لا يضمن التطبيق والأثر الواقعي."},{text:"إنهاء أوراق الحقيبة ودلائل الأنشطة دون تنفيذها",isCorrect:false,rationale:"توثيق شكلي يفتقد للجوهر والعمل الميداني."}]},
            // Domain 4
            {id:61,domain:4,domainName:"مهارات المستقبل",question:"مدرب يلاحظ زميله يمر بضغط نفسي شديد قبيل جلسة تدريبية مهمة. أي سلوك يعكس الذكاء العاطفي والاجتماعي (EQ) للمدرب؟",options:[{text:"تجاهل الأمر تماماً حفاظاً على وقته الشخصي",isCorrect:false,rationale:"يظهر ضعف الحساسية الاجتماعية والتعاطف."},{text:"انتقاد الزميل أمام الجميع لعدم استعداده",isCorrect:false,rationale:"يزيد الضغط النفسي ويهدم العلاقة الزميلية."},{text:"التعبير عن التعاطف، وتقديم الدعم العملي والنفسي ومساعدته لتهدئة روعه",isCorrect:true,rationale:"الذكاء العاطفي يشمل الوعي بمشاعر الآخرين، والتعاطف، وتقديم المساندة بمرونة."},{text:"رفع تقرير سلبية فوري للإدارة دون الحديث معه",isCorrect:false,rationale:"تصرف إداري جاف يخلو من البُعد الإنساني والذكاء الاجتماعي."}]},
            {id:62,domain:4,domainName:"مهارات المستقبل",question:"كيف يمكن للمدرب توظيف أدوات 'الذكاء الاصطناعي التوليدي' (Generative AI) بمهنية في إعداد التدريب؟",options:[{text:"نسخ المحتوى الصادر من الذكاء الاصطناعي بالكامل دون مراجعة أو تحقق علمي",isCorrect:false,rationale:"يعرض الحقيبة للأخطاء والهلوسة الرقمية وانتهاك الأمانة العلمية."},{text:"استخدامه كمساعد لإلهام الأفكار، وتصميم الهياكل، وتوليد السيناريوهات مع التعديل والتحقق من المراجع",isCorrect:true,rationale:"الاستخدام الذكي للـ AI يسرع الإنتاجية بشرط التدقيق البشري وإضفاء الخبرة التخصصية."},{text:"حظر استخدام الذكاء الاصطناعي ومنعه تماماً في كافة مراحل العمل",isCorrect:false,rationale:"تخلف عن مواكبة أدوات المستقبل الرقمية التي ترفع كفاءة العمل."},{text:"استخدامه لإنشاء شهادات وهمية للمتدربين",isCorrect:false,rationale:"استخدام غير مشروع يخرق القوانين الأخلاقية."}]},
            {id:63,domain:4,domainName:"مهارات المستقبل",question:"أي المهارات التالية تُصنف ضمن 'المهارات الناعمة' (Soft Skills) الأكثر طلباً للمدرب في سوق العمل المستقبلي؟",options:[{text:"صيانة أجهزة العروض الميكانيكية",isCorrect:false,rationale:"مهارة تقنية/صلبة فنية محدودة."},{text:"التفكير الناقد، والمرونة والتكيف، والتواصل الفعال، وحل المشكلات المعقدة",isCorrect:true,rationale:"المهارات الناعمة تمثل سلوكيات وممارسات التفكير والمرونة والتفاعل البشري المتقدم."},{text:"سرعة الطباعة على لوحة المفاتيح",isCorrect:false,rationale:"مهارة أدائية إجرائية بسيطة."},{text:"حفظ النصوص القانونية عن ظهر قلب",isCorrect:false,rationale:"استرجاع معرفي مجرد لا يضمن التكيف والحل المبتكر."}]},
            {id:64,domain:4,domainName:"مهارات المستقبل",question:"ما المفهوم المعروف بـ 'التغذية الراجعة التكيفية الرقمية' (Adaptive Learning) في المنصات الإلكترونية؟",options:[{text:"تقديم نفس المسار ونفس الأسئلة لجميع المتعلمين دون تغيير",isCorrect:false,rationale:"هذا هو التدريب التقليدي النمطي."},{text:"تعديل المسار والمحتوى والأنشطة تلقائياً بواسطة خوارزميات بناءً على مستوى أداء وسرعة كل متدرب",isCorrect:true,rationale:"التعلم التكيفي يفرّد تجربة التعلم لكل شخص طبقاً لنقاط قوته وفجواته."},{text:"إرسال رسائل نصية يومية للتذكير بجدول الدورة",isCorrect:false,rationale:"خدمة تنبيهات إدارية بسيطة."},{text:"إغلاق المنصة تلقائياً بعد ساعة من الفتح",isCorrect:false,rationale:"خاصية ضبط وقت لا علاقة لها بالتكيف التعلمي."}]},
            {id:65,domain:4,domainName:"مهارات المستقبل",question:"في جلسات التدريب الافتراضي عبر البرامج (مثل MS Teams أو Zoom)، الأسلوب الأنسب لتقسيم المتدربين لورش عمل هو:",options:[{text:"طلب منهم إغلاق البرنامج والاتصال ببعضهم عبر الهاتف الشخصي",isCorrect:false,rationale:"يفقد التناغم الموحد ويسهل متابعة المدرب للمجموعات."},{text:"استخدام خاصية 'غرف النقاش الفرعية' (Breakout Rooms) مع التنقل بينهم للإشراف والدعم",isCorrect:true,rationale:"تضمن الميزة تفاعل المجموعات الصغيرة سحابياً مع قدرة المدرب على الدعم والتوجيه."},{text:"إلغاء ورش العمل والاقتصار على حديث المدرب",isCorrect:false,rationale:"يحول التدريب الافتراضي إلى محض محاضرة جافة."},{text:"ترك الجميع يتحدثون في الميكروفون الرئيسي في وقت واحد",isCorrect:false,rationale:"يحدث ضوضاء وفوضى عارمة تمنع الفهم."}]},
            {id:66,domain:4,domainName:"مهارات المستقبل",question:"ما مفهوم 'المايكروليرنينج' أو التعلم المصغر (Micro-learning) في بيئة التدريب الرقمية الحديثة؟",options:[{text:"تقديم المحتوى في جلسات طويلة تمتد لـ 12 ساعة متواصلة",isCorrect:false,rationale:"عكس التعلم المصغر تماماً ويسبب الإجهاد."},{text:"تقديم المعرفة والمهارات في وحدات كبسولية صغيرة ومقاطع مركزة (من 3 إلى 5 دقائق) لتسهيل الاستيعاب",isCorrect:true,rationale:"يتناسب التعلم المصغر مع نمط الحياة السريع وتشتت الانتباه ويسهل الوصول السريع عبر الجوال."},{text:"تدريب الأطفال الصغار فقط على الألعاب",isCorrect:false,rationale:"ترجمة خاطئة للمفهوم."},{text:"الاعتماد التام على المطبوعات الورقية المصغرة",isCorrect:false,rationale:"يتعلق بالبنية التقنية والمحتوى الرقمي المكثف."}]},
            {id:67,domain:4,domainName:"مهارات المستقبل",question:"تُعتبر مهارة 'تحليل البيانات التدريبية' (Learning Analytics) مهمة للمدرب القائد لأنها تساعده على:",options:[{text:"معرفة المبيعات المالية لشركات التقنية",isCorrect:false,rationale:"بيانات تسويقية خارج النطاق التدريبي الفردي."},{text:"قراءة مؤشرات المشاركة، ومعدلات الأداء، واكتشاف الفجوات لاتخاذ قرارات تحسين مستندة للأدلة",isCorrect:true,rationale:"تحليل البيانات يمنح رؤية عملية دقيقة مبنية على الأرقام لتطوير المحتوى والأساليب."},{text:"زيادة أعداد الأسئلة التعجيزية في الاختبارات",isCorrect:false,rationale:"استخدام خاطئ للتقويم."},{text:"حذف حسابات المتدربين من المنصة إلكترونياً",isCorrect:false,rationale:"إجراء إداري زجري لا يخدم التحسين."}]},
            {id:68,domain:4,domainName:"مهارات المستقبل",question:"أي السلوكيات التالية يُمثل تكاملاً فعلياً بين مهارات التفكير والتطبيقات الرقمية في الممارسة التدريبية؟",options:[{text:"استخدام الحاسب لطباعة الاختبارات الورقية فقط",isCorrect:false,rationale:"استخدام بدائي للتقنية كبديل للآلة الكاتبة."},{text:"عرض الشرائح الرقمية بنفس طريقة اللوح والطباشير التقليدية دون تفاعل",isCorrect:false,rationale:"استبدال الوسيلة مع بقاء نفس المنهجية التلقينية."},{text:"توظيف أدوات التحليل البياني الرقمي والخرائط التفاعلية لاستخلاص النتائج وحل المشكلات",isCorrect:true,rationale:"تكامل حقيقي يجمع بين المهارة التقنية المتقدمة والتفكير الناقد في اتخاذ القرار."},{text:"استخدام الهاتف الذكي لإرسال التهاني فقط",isCorrect:false,rationale:"استخدام اجتماعي عام لا يتصل بالتكامل التدريبي."}]},
            {id:69,domain:4,domainName:"مهارات المستقبل",question:"ما فائدة تطبيق تقنيات 'التلعيب' (Gamification) في البيئات التدريبية الرقمية والحضورية؟",options:[{text:"تحويل التدريب إلى مجرد تسلية وألعاب أطفال دون هدف معرفي",isCorrect:false,rationale:"فهم قاصر يتجاهل النواحي التعليمية."},{text:"دمج عناصر الألعاب (كالمستويات، النقاط، الأوسمة، والمسابقات) لتحفيز المشاركة ورفع الدافعية",isCorrect:true,rationale:"التلعيب يزيد من اندماج المتدربين والمتعة والارتباط بالتعلم لتحقيق الأهداف التدريبية."},{text:"إلغاء المادة العلمية واكتفاء باللعب",isCorrect:false,rationale:"تفريغ للدورة من محتواها المهاراتي المعرفي."},{text:"إجبار المتدربين على الشراء داخل التطبيق",isCorrect:false,rationale:"استغلال تجاري غير مشروع."}]},
            {id:70,domain:4,domainName:"مهارات المستقبل",question:"أي التقنيات التالية تسمح للمتدربين بالتدرب على مهارات خطرة (كإطفاء الحرائق أو العمليات الجراحية) بآمان تام؟",options:[{text:"المحاضرة الشفهية النظرية",isCorrect:false,rationale:"لا توفر خبرة التكرار الحركي والبيئة الواقعية."},{text:"تقنيات الواقع الافتراضي والواقع المعزز (VR / AR Simulation)",isCorrect:true,rationale:"توفر بيئة محاكاة غاطسة غنية تحاكي الواقع وتمنع المخاطر والتكلفة الباهظة."},{text:"قراءة الكتيبات الورقية",isCorrect:false,rationale:"تمنح معرفة بدون تجربة حسية وبصرية وتفاعلية."},{text:"الاستماع لتسجيل صوتي قديم",isCorrect:false,rationale:"وسيلة قديمة لا تنقل بيئة الواقع المعقد."}]},
            {id:71,domain:4,domainName:"مهارات المستقبل",question:"ما الواجب على المدرب اتخاذه للحفاظ على 'الأمن السيبراني والخصوصية' أثناء إقامة جلسة تدريبية عبر الإنترنت؟",options:[{text:"مشاركة رابط القاعة الافتراضية بكلمة مرور مفتوحة للعموم في المنصات العامة",isCorrect:false,rationale:"يعرض الجلسة للاختراق والتشويش والاقتحام غير المصرح به (Zoom-bombing)."},{text:"تأمين القاعة بكلمات مرور، وغرفة انتظار (Waiting Room)، وعدم تسجيل المتدربين إلا بإذن صريح",isCorrect:true,rationale:"إجراءات الأمن السيبراني تحمي الخصوصية، وتمنع المتطفلين، وتضمن سلامة البيئة الافتراضية."},{text:"طلب كلمة المرور الخاصة بالبريد الإلكتروني لكل متدرب",isCorrect:false,rationale:"انتهاك لخصوصية الحسابات ولا يحق للمدرب طلبه."},{text:"سحب كافة بيانات الأجهزة الشخصية للمشاركين",isCorrect:false,rationale:"تعدٍ غير قانوني على خصوصية الأجهزة."}]},
            {id:72,domain:4,domainName:"مهارات المستقبل",question:"القدرة على التعلم الذاتي المستمر وتحديث المهارات (Reskilling & Upskilling) تعني أن المدرب يتصف بـ:",options:[{text:"الجمود والتمسك بالمهارات القديمة نفسها",isCorrect:false,rationale:"عكس التكيف ومواكبة المستقبل."},{text:"عقلية النمو (Growth Mindset) والقدرة على التكيف مع تغيرات سوق العمل والتكنولوجيا",isCorrect:true,rationale:"عقلية النمو تجعل الفرد شغوفاً بالتعلم المستمر واكتساب أدوات العصر الحديثة."},{text:"انتظار المؤسسة لتفرض عليه الدورات بالقوة",isCorrect:false,rationale:"موقف سلبي يفتقد للمبادرة الذاتية."},{text:"ترك مهنة التدريب بالكامل عند ظهور التقنية",isCorrect:false,rationale:"هروب بدلاً من التكيف وتطوير الذات."}]},
            {id:73,domain:4,domainName:"مهارات المستقبل",question:"المصطلح المقترن بالهوية المهنية الرقمية للمدرب على شبكات التواصل المتخصصة (مثل LinkedIn) هو:",options:[{text:"التخفي والعمل بالأسماء المستعارة الوهمية",isCorrect:false,rationale:"يقلل الثقة والمصداقية المهنية."},{text:"بناء العلامة الشخصية المهنية (Personal Branding) وإبراز الخبرات والقيم المضافة",isCorrect:true,rationale:"بناء العلامة الشخصية يعكس الاحترافية والتواجد الرقمي الواعي في سوق العمل المستقبلي."},{text:"نشر المنشورات العشوائية غير المتخصصة بكثرة",isCorrect:false,rationale:"يشتت المتابعين ويضعف الصورة الذهنية للتخصص."},{text:"شراء المتابعين الوهميين بالمال",isCorrect:false,rationale:"خداع يسهل اكتشافه ويدمر المصداقية."}]},
            {id:74,domain:4,domainName:"مهارات المستقبل",question:"عند بناء ورشة تدريبية لتعليم 'حل المشكلات المعقدة' (Complex Problem Solving)، أفضل منهجية تصميم هي:",options:[{text:"إعطاء الحلول الجاهزة وحفظها للاختبار",isCorrect:false,rationale:"لا ينمي مهارة التفكير والتحليل بالمرة."},{text:"منهجية التفكير التصميمي (Design Thinking) والتعلم القائم على المشكلات (PBL)",isCorrect:true,rationale:"التفكير التصميمي (تعاطف، تحديد، توليد أفكار، نموذج، اختبار) ينمي الابتكار والحلول التكيفية."},{text:"قراءة رواية أدبية غير مرتبطة بالموضوع",isCorrect:false,rationale:"تشتيت عن موضوع المهارة المحددة."},{text:"المحاضرة التقليدية أحادية الاتجاه",isCorrect:false,rationale:"لا تتيح التجريب الفعلي وحل التحديات."}]},
            {id:75,domain:4,domainName:"مهارات المستقبل",question:"تفاعل المدرب الرقمي مع المتدربين في المنصات اللاتزامنية (Asynchronous Learning) يتم غالباً عبر:",options:[{text:"البث المباشر المستمر لمدة 24 ساعة",isCorrect:false,rationale:"البث المباشر هو تعلم متزامن (Synchronous)."},{text:"منتديات النقاش، والملاحظات الصوتية المكتوبة، والتقييمات الذاتية المجدولة عبر منصة LMS",isCorrect:true,rationale:"التعلم اللاتزامني يتطرق للتفاعل المستقل مرن الوقت دون الحاجة للتواجد اللحظي في وقت واحد."},{text:"اللقاء الحضوري في القاعة فقط",isCorrect:false,rationale:"هذا تدريب حضوري مباشر وليس لاتزامني رقمي."},{text:"الرسائل الورقية عبر البريد المكتوب التقليدي",isCorrect:false,rationale:"وسيلة قديمة لا تتناسب مع المنصات الرقمية."}]},
            {id:76,domain:4,domainName:"مهارات المستقبل",question:"أثناء تقديم العرض التقديمي الافتراضي، ما التقنية التي تساعد المدرب على متابعة أسئلة الدردشة والنص في وقت واحد؟",options:[{text:"إغلاق نافذة الدردشة ومنع الأسئلة نهائياً",isCorrect:false,rationale:"يلغي التفاعل والمشاركة الرقمية."},{text:"استخدام شاشتين (Dual Monitors) أو الاستعانة بميسر مساند (Co-host / Moderator)",isCorrect:true,rationale:"يعزز الإدارة السلسة وتلبية استفسارات الجمهور دون التوقف المفاجئ للعرض."},{text:"التوقف عن الحديث لمدة نصف ساعة لقراءة الرسائل",isCorrect:false,rationale:"يقطع تسلسل الأفكار ويكسر ريتم الجلسة."},{text:"طلب من المتدربين الاتصال به بعد أسبوع",isCorrect:false,rationale:"تفقد التغذية الراجعة واللقاء الافتراضي قيمته."}]},
            {id:77,domain:4,domainName:"مهارات المستقبل",question:"ما الفائدة الأساسية من الحفظ التلقائي للحقائب والمستندات على 'السحابة الرقمية' (Cloud Storage مثل OneDrive / Google Drive)؟",options:[{text:"زيادة استهلاك بطارية الجهاز فقط",isCorrect:false,rationale:"أثر جانبي بسيط مقابل الفائدة الكبرى."},{text:"سهولة الوصول من أي جهاز، والنسخ الاحتياطي، وإمكانية التحرير التشاركي الفوري مع فريق العمل",isCorrect:true,rationale:"التخزين السحابي يوفر المرونة والتعاون الفوري وحماية الملفات من الضياع."},{text:"منع أي شخص من فتح الملفات للأبد",isCorrect:false,rationale:"السحابة تدعم المشاركة المحددة بصلاحيات مرنة."},{text:"تحويل النص تلقائياً إلى مقطع فيديو سينمائي",isCorrect:false,rationale:"هذه ميزة أدوات توليد فيديو وليس التخزين السحابي."}]},
            {id:78,domain:4,domainName:"مهارات المستقبل",question:"أي الممارسات التالية تُساعد المدرب على تنظيم وبناء 'مجتمع تعلم مهني افتراضي' (PLC) مستدام للمتدربين؟",options:[{text:"حظر التواصل بين المتدربين بعد نهاية اليوم الأخير",isCorrect:false,rationale:"يقطع أثر استدامة التعلم والشبكات المهنية."},{text:"إنشاء مجموعة تفاعلية موجّهة (مثل LinkedIn Group / Slack) لمشاركة التجارب والمقالات ودعم التطبيق",isCorrect:true,rationale:"مجتمعات التعلم الافتراضية تعزز نقل الأثر وتوفر المساندة المستمرة بعد انتهاء البرنامج."},{text:"إلزامهم بدفع اشتراكات شهرية متزايدة",isCorrect:false,rationale:"هدف تجاري ينفر الأعضاء من الاستمرار."},{text:"إغلاق أي مناقشة تثري التخصص",isCorrect:false,rationale:"يتنافى مع روح التعلم المستمر."}]},
            {id:79,domain:4,domainName:"مهارات المستقبل",question:"ما المقصود بـ 'المرونة الرقمية' (Digital Agility) في مهارات المدرب المستقبلي؟",options:[{text:"القدرة على سرعة أداء التمارين الرياضية أمام الكاميرا",isCorrect:false,rationale:"خلط بين اللياقة البدنية والمرونة الرقمية."},{text:"السرعة والقدرة على التكيف مع التحديثات والبرامج الرقمية الجديدة وتوظيفها بمرونة في التدريب",isCorrect:true,rationale:"المرونة الرقمية تعني سرعة الاستجابة والتكيف مع الأدوات والتقنيات الناشئة دون خوف."},{text:"استخدام جهاز حاسوب واحد طوال الحياة",isCorrect:false,rationale:"جمود تقني يتنافى مع مفهوم المرونة."},{text:"الاستغناء عن الإنترنت تماماً في العمليات التدريبية",isCorrect:false,rationale:"عزل عن البيئة الرقمية الحديثة."}]},
            {id:80,domain:4,domainName:"مهارات المستقبل",question:"المعادلة الذهبية لنجاح المدرب في عصر المستقبل تعتمد على التوازن بين:",options:[{text:"التقنية فقط بدون أي وجود للمهارات البشرية والتعاطف",isCorrect:false,rationale:"تجعل التدريب جافاً ومجرداً من الروح الإنسانية."},{text:"التمكين التقني الرقمي الذكي مع المهارات الإنسانية العميقة (التواصل، التعاطف، والقيادة)",isCorrect:true,rationale:"الدمج بين التقنية المتقدمة واللمسة الإنسانية العميقة (High Tech + High Touch) هو جوهر التميز المستقبلي."},{text:"المحاضرة التقليدية الجافة والصمت التام",isCorrect:false,rationale:"أسلوب قديم لا يواكب متطلبات العصر."},{text:"التدريب دون إعداد حقيبة أو أهداف",isCorrect:false,rationale:"عشوائية تضمن الفشل والضعف في الأداء."}]}
        ];

        // ========== HELPERS ==========
        const DOMAIN_META = {
            1: { name: "المعرفة المهنية", color: "blue", bg: "bg-blue-100 dark:bg-blue-900/40", text: "text-blue-800 dark:text-blue-200", border: "border-blue-400", icon: Book },
            2: { name: "الممارسات المهنية", color: "emerald", bg: "bg-emerald-100 dark:bg-emerald-900/40", text: "text-emerald-800 dark:text-emerald-200", border: "border-emerald-400", icon: Target },
            3: { name: "القيم والمسؤوليات", color: "purple", bg: "bg-purple-100 dark:bg-purple-900/40", text: "text-purple-800 dark:text-purple-200", border: "border-purple-400", icon: Shield },
            4: { name: "مهارات المستقبل", color: "cyan", bg: "bg-cyan-100 dark:bg-cyan-900/40", text: "text-cyan-800 dark:text-cyan-200", border: "border-cyan-400", icon: Cpu }
        };

        const STORAGE_KEY = "etec_trainer_license_quiz_v2";

        // ========== MAIN APP ==========
        const QuizApp = () => {
            const [darkMode, setDarkMode] = useState(() => localStorage.getItem("etec_dark") === "1");
            const [step, setStep] = useState("welcome"); // welcome | quiz | results | review
            const [mode, setMode] = useState("practice"); // practice | exam
            const [selectedDomain, setSelectedDomain] = useState("all");
            const [activeQuestions, setActiveQuestions] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [userAnswers, setUserAnswers] = useState({}); // index -> optionIndex | -1 (timeout) | -2 (skipped)
            const [showFeedback, setShowFeedback] = useState(false);
            const [timeLeft, setTimeLeft] = useState(60);
            const [isTimerRunning, setIsTimerRunning] = useState(false);
            const [showMap, setShowMap] = useState(true);
            const [notes, setNotes] = useState({});
            const [copiedMsg, setCopiedMsg] = useState(false);
            const [timerDuration, setTimerDuration] = useState(60);
            const [shuffleOptions, setShuffleOptions] = useState(false);
            const timerRef = useRef(null);
            const autoNextRef = useRef(null);

            useEffect(() => {
                if (darkMode) document.documentElement.classList.add("dark");
                else document.documentElement.classList.remove("dark");
                localStorage.setItem("etec_dark", darkMode ? "1" : "0");
            }, [darkMode]);

            // Persist progress
            useEffect(() => {
                if (step === "quiz" && activeQuestions.length) {
                    const data = { selectedDomain, mode, currentIndex, userAnswers, notes, timerDuration };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                }
            }, [step, currentIndex, userAnswers, notes, selectedDomain, mode, timerDuration, activeQuestions.length]);

            const startQuiz = (domainId, quizMode = mode) => {
                let filtered = domainId === "all" ? [...allQuestions] : allQuestions.filter(q => q.domain === domainId);
                if (shuffleOptions) {
                    filtered = filtered.map(q => ({
                        ...q,
                        options: [...q.options].sort(() => Math.random() - 0.5)
                    }));
                }
                setSelectedDomain(domainId);
                setMode(quizMode);
                setActiveQuestions(filtered);
                setCurrentIndex(0);
                setUserAnswers({});
                setShowFeedback(false);
                setTimeLeft(timerDuration);
                setIsTimerRunning(true);
                setStep("quiz");
                setNotes({});
            };

            const resumeProgress = () => {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return;
                    const data = JSON.parse(raw);
                    let filtered = data.selectedDomain === "all" ? [...allQuestions] : allQuestions.filter(q => q.domain === data.selectedDomain);
                    setSelectedDomain(data.selectedDomain);
                    setMode(data.mode || "practice");
                    setActiveQuestions(filtered);
                    setCurrentIndex(data.currentIndex || 0);
                    setUserAnswers(data.userAnswers || {});
                    setNotes(data.notes || {});
                    setTimerDuration(data.timerDuration || 60);
                    setTimeLeft(data.timerDuration || 60);
                    setShowFeedback(false);
                    setIsTimerRunning(true);
                    setStep("quiz");
                } catch (e) {}
            };

            // Timer
            useEffect(() => {
                if (step === "quiz" && isTimerRunning && !showFeedback) {
                    timerRef.current = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                clearInterval(timerRef.current);
                                handleTimeout();
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                } else {
                    clearInterval(timerRef.current);
                }
                return () => clearInterval(timerRef.current);
            }, [step, isTimerRunning, showFeedback, currentIndex]);

            const handleTimeout = () => {
                setIsTimerRunning(false);
                setUserAnswers(prev => {
                    if (prev[currentIndex] === undefined) return { ...prev, [currentIndex]: -1 };
                    return prev;
                });
                if (mode === "practice") {
                    setShowFeedback(true);
                    autoNextRef.current = setTimeout(() => {
                        goNext(true);
                    }, 3500);
                } else {
                    // Exam: auto advance immediately
                    setTimeout(() => goNext(true), 600);
                }
            };

            const handleAnswer = (optionIndex) => {
                if (showFeedback || userAnswers[currentIndex] !== undefined) return;
                clearInterval(timerRef.current);
                clearTimeout(autoNextRef.current);
                setIsTimerRunning(false);
                setUserAnswers(prev => ({ ...prev, [currentIndex]: optionIndex }));
                if (mode === "practice") {
                    setShowFeedback(true);
                } else {
                    // Exam mode: no feedback, just mark and enable next
                    setShowFeedback(false);
                }
            };

            const goNext = (fromTimeout = false) => {
                clearTimeout(autoNextRef.current);
                if (currentIndex < activeQuestions.length - 1) {
                    setCurrentIndex(i => i + 1);
                    setShowFeedback(false);
                    setTimeLeft(timerDuration);
                    setIsTimerRunning(true);
                } else {
                    setStep("results");
                    setIsTimerRunning(false);
                }
            };

            const goPrev = () => {
                if (mode === "exam") return; // no back in exam
                if (currentIndex > 0) {
                    clearTimeout(autoNextRef.current);
                    setCurrentIndex(i => i - 1);
                    const ans = userAnswers[currentIndex - 1];
                    setShowFeedback(ans !== undefined && mode === "practice");
                    setTimeLeft(timerDuration);
                    setIsTimerRunning(ans === undefined);
                }
            };

            const skipQuestion = () => {
                if (userAnswers[currentIndex] !== undefined) return;
                clearInterval(timerRef.current);
                clearTimeout(autoNextRef.current);
                setIsTimerRunning(false);
                setUserAnswers(prev => ({ ...prev, [currentIndex]: -2 })); // skipped
                if (mode === "practice") setShowFeedback(true);
                else setTimeout(() => goNext(), 300);
            };

            const jumpTo = (idx) => {
                if (mode === "exam" && userAnswers[idx] === undefined && idx !== currentIndex) return;
                clearTimeout(autoNextRef.current);
                setCurrentIndex(idx);
                const ans = userAnswers[idx];
                setShowFeedback(ans !== undefined && mode === "practice");
                setTimeLeft(timerDuration);
                setIsTimerRunning(ans === undefined && step === "quiz");
            };

            const resetToHome = () => {
                clearInterval(timerRef.current);
                clearTimeout(autoNextRef.current);
                setIsTimerRunning(false);
                setStep("welcome");
            };

            const calculateScore = () => {
                let correct = 0, wrong = 0, timeout = 0, skipped = 0;
                activeQuestions.forEach((q, idx) => {
                    const ans = userAnswers[idx];
                    if (ans === -1) timeout++;
                    else if (ans === -2 || ans === undefined) skipped++;
                    else if (q.options[ans]?.isCorrect) correct++;
                    else wrong++;
                });
                return { correct, wrong, timeout, skipped, total: activeQuestions.length, percentage: Math.round((correct / activeQuestions.length) * 100) };
            };

            const getStatus = (idx) => {
                const ans = userAnswers[idx];
                if (ans === undefined) return "gray";
                if (ans === -1) return "yellow";
                if (ans === -2) return "gray";
                if (activeQuestions[idx]?.options[ans]?.isCorrect) return "green";
                return "red";
            };

            const copyQuestion = () => {
                const q = activeQuestions[currentIndex];
                if (!q) return;
                const letters = ["أ", "ب", "ج", "د"];
                let text = `السؤال ${currentIndex + 1}:\n${q.question}\n\n`;
                q.options.forEach((o, i) => {
                    text += `${letters[i]}) ${o.text}\n`;
                });
                navigator.clipboard.writeText(text).then(() => {
                    setCopiedMsg(true);
                    setTimeout(() => setCopiedMsg(false), 2000);
                });
            };

            // Keyboard shortcuts
            useEffect(() => {
                const handler = (e) => {
                    if (step !== "quiz") return;
                    if (e.key === "ArrowLeft") goNext();
                    if (e.key === "ArrowRight" && mode === "practice") goPrev();
                    if (["1","2","3","4"].includes(e.key) && !showFeedback) handleAnswer(parseInt(e.key)-1);
                    if (e.key.toLowerCase() === "c") copyQuestion();
                    if (e.key.toLowerCase() === "h") resetToHome();
                    if (e.key.toLowerCase() === "m") setShowMap(s => !s);
                };
                window.addEventListener("keydown", handler);
                return () => window.removeEventListener("keydown", handler);
            });

            const currentQ = activeQuestions[currentIndex];
            const domainInfo = currentQ ? DOMAIN_META[currentQ.domain] : null;
            const DomainIcon = domainInfo?.icon || Layers;

            const getTimerStyle = () => {
                if (timeLeft > 30) return "text-etec-700 border-etec-500 bg-etec-50 dark:bg-etec-900/40 dark:text-etec-300";
                if (timeLeft > 10) return "text-amber-600 border-amber-500 bg-amber-50 dark:bg-amber-900/40";
                return "text-red-600 border-red-500 bg-red-50 dark:bg-red-900/40 pulse-red";
            };

            // ========== WELCOME ==========
            if (step === "welcome") {
                const hasProgress = !!localStorage.getItem(STORAGE_KEY);
                return (
                    <div className="min-h-screen etec-pattern flex flex-col">
                        {/* Top bar */}
                        <div className="bg-etec-primary text-white py-2 px-4 text-center text-sm font-medium">
                            مستوحى من معايير هيئة تقويم التعليم والتدريب (ETEC) — الرخصة المهنية للمدربين
                        </div>

                        <div className="flex-1 flex items-center justify-center p-4 md:p-8">
                            <div className="max-w-5xl w-full glass rounded-3xl shadow-2xl border border-slate-200/60 dark:border-slate-700 p-6 md:p-10 fade-in">
                                <div className="flex justify-between items-start mb-6">
                                    <div className="flex items-center gap-3">
                                        <div className="w-14 h-14 bg-etec-primary rounded-2xl flex items-center justify-center shadow-lg">
                                            <Award className="w-8 h-8 text-white" />
                                        </div>
                                        <div>
                                            <h1 className="text-2xl md:text-3xl font-extrabold text-slate-800 dark:text-white">بنك أسئلة الرخصة المهنية للمدربين</h1>
                                            <p className="text-sm text-etec-700 dark:text-etec-300 font-medium mt-0.5">إعداد المهندس سمير حبيب بنتن</p>
                                        </div>
                                    </div>
                                    <button onClick={() => setDarkMode(!darkMode)} className="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                                        {darkMode ? <Sun className="w-5 h-5" /> : <Moon className="w-5 h-5" />}
                                    </button>
                                </div>

                                <p className="text-slate-600 dark:text-slate-300 mb-6 leading-relaxed">
                                    أداة تدريب تفاعلية شاملة (80 سؤالاً) تغطي المجالات الأربعة لمعايير الرخصة المهنية للمدربين. اختر الوضع والمجال ثم ابدأ.
                                </p>

                                {/* Mode + Settings */}
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                    <div className="p-4 rounded-2xl border-2 border-etec-200 dark:border-etec-800 bg-etec-50/50 dark:bg-etec-900/20">
                                        <label className="block text-sm font-bold mb-2 text-etec-800 dark:text-etec-200">وضع الاختبار</label>
                                        <div className="flex gap-2">
                                            <button onClick={() => setMode("practice")} className={`flex-1 py-2 rounded-xl text-sm font-bold transition ${mode==="practice" ? "bg-etec-primary text-white" : "bg-white dark:bg-slate-800 border"}`}>تدريب</button>
                                            <button onClick={() => setMode("exam")} className={`flex-1 py-2 rounded-xl text-sm font-bold transition ${mode==="exam" ? "bg-etec-primary text-white" : "bg-white dark:bg-slate-800 border"}`}>محاكاة رسمية</button>
                                        </div>
                                        <p className="text-xs text-slate-500 mt-2">{mode==="practice" ? "يظهر التحليل فور الإجابة + رجوع مسموح" : "لا تحليل حتى النهاية + منع الرجوع"}</p>
                                    </div>
                                    <div className="p-4 rounded-2xl border border-slate-200 dark:border-slate-700">
                                        <label className="block text-sm font-bold mb-2">مدة المؤقت (ثانية)</label>
                                        <select value={timerDuration} onChange={e => setTimerDuration(+e.target.value)} className="w-full p-2 rounded-xl border dark:bg-slate-800 dark:border-slate-600 text-sm">
                                            <option value={30}>30</option>
                                            <option value={45}>45</option>
                                            <option value={60}>60 (افتراضي)</option>
                                            <option value={90}>90</option>
                                            <option value={0}>بدون مؤقت</option>
                                        </select>
                                    </div>
                                    <div className="p-4 rounded-2xl border border-slate-200 dark:border-slate-700 flex flex-col justify-center">
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-medium">
                                            <input type="checkbox" checked={shuffleOptions} onChange={e => setShuffleOptions(e.target.checked)} className="rounded text-etec-primary" />
                                            خلط ترتيب الخيارات
                                        </label>
                                        {hasProgress && (
                                            <button onClick={resumeProgress} className="mt-3 w-full py-2 bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-200 rounded-xl text-sm font-bold hover:bg-amber-200 transition">
                                                استكمال التقدم السابق
                                            </button>
                                        )}
                                    </div>
                                </div>

                                {/* Full quiz CTA */}
                                <button onClick={() => startQuiz("all", mode)} className="w-full group flex items-center justify-between p-5 md:p-6 bg-gradient-to-l from-etec-primary to-etec-dark text-white rounded-2xl shadow-xl hover:shadow-2xl hover:scale-[1.01] transition-all mb-6">
                                    <div className="flex items-center gap-4 text-right">
                                        <div className="p-3 bg-white/20 rounded-xl"><Layers className="w-8 h-8" /></div>
                                        <div>
                                            <span className="block text-xl md:text-2xl font-black">الاختبار الشامل — 80 سؤالاً</span>
                                            <span className="text-etec-100 text-sm">جميع المجالات طبقاً لمعايير هيئة تقويم التعليم والتدريب</span>
                                        </div>
                                    </div>
                                    <div className="bg-white text-etec-primary px-5 py-3 rounded-xl font-bold flex items-center gap-2 shadow">
                                        ابدأ الآن
                                        <ChevronLeft className="w-5 h-5 group-hover:-translate-x-1 transition" />
                                    </div>
                                </button>

                                <div className="relative my-6">
                                    <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-slate-200 dark:border-slate-700"></div></div>
                                    <div className="relative flex justify-center text-sm"><span className="px-4 bg-white dark:bg-slate-900 text-slate-500 font-bold">أو اختر مجالاً محدداً (20 سؤالاً)</span></div>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    {[1,2,3,4].map(d => {
                                        const m = DOMAIN_META[d];
                                        const IconComp = m.icon;
                                        return (
                                            <div key={d} onClick={() => startQuiz(d, mode)} className={`p-5 rounded-2xl border-2 ${m.border} ${m.bg} cursor-pointer hover:shadow-md transition-all flex flex-col`}>
                                                <div className="flex justify-between items-start mb-3">
                                                    <div className={`p-2.5 rounded-xl bg-white/80 dark:bg-slate-800 shadow-sm`}><IconComp className={`w-6 h-6 text-${m.color}-600`} /></div>
                                                    <span className="text-xs font-bold px-2.5 py-1 rounded-full bg-white/70 dark:bg-slate-800">20 سؤالاً</span>
                                                </div>
                                                <h3 className="text-lg font-bold mb-1">{m.name}</h3>
                                                <p className="text-sm text-slate-600 dark:text-slate-300 flex-1 mb-3">
                                                    {d===1 && "نظريات التعلم، الأندراغوجيا، ADDIE/SAM، الاحتياجات التدريبية"}
                                                    {d===2 && "إدارة القاعة، التيسير، لغة الجسد، التعامل مع أنماط المتدربين"}
                                                    {d===3 && "الأخلاقيات، الملكية الفكرية، السرية، النزاهة، المسؤولية"}
                                                    {d===4 && "الذكاء الاصطناعي، التدريب الرقمي، EQ، الواقع الافتراضي"}
                                                </p>
                                                <button className={`w-full py-2.5 rounded-xl text-sm font-bold text-white bg-${m.color}-600 hover:opacity-90 transition flex items-center justify-center gap-1`}>
                                                    اختبار هذا المجال <ChevronLeft className="w-4 h-4" />
                                                </button>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="mt-8 pt-6 border-t border-slate-200 dark:border-slate-700 text-center text-sm text-slate-500">
                                    <p>إعداد وتطوير: <span className="font-bold text-etec-primary">المهندس سمير حبيب بنتن</span></p>
                                    <p className="mt-1 text-xs">اختصارات: ← التالي | → السابق | 1-4 اختيار | C نسخ | H رئيسية | M خريطة</p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // ========== QUIZ ==========
            if (step === "quiz" && currentQ) {
                const statusColors = {
                    green: "bg-emerald-200 dark:bg-emerald-800 text-emerald-900 dark:text-emerald-100 border-emerald-400",
                    red: "bg-red-200 dark:bg-red-900/60 text-red-900 dark:text-red-100 border-red-400",
                    yellow: "bg-amber-200 dark:bg-amber-900/60 text-amber-900 dark:text-amber-100 border-amber-400",
                    gray: "bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 border-slate-300"
                };

                return (
                    <div className="min-h-screen etec-pattern flex flex-col">
                        {/* Header */}
                        <div className="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-slate-200 dark:border-slate-700 shadow-sm">
                            <div className="max-w-6xl mx-auto px-3 py-2.5 flex flex-wrap items-center justify-between gap-2">
                                <div className="flex items-center gap-2">
                                    <button onClick={resetToHome} className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-sm font-bold hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                                        <Home className="w-4 h-4" /> رئيسية
                                    </button>
                                    <button onClick={() => setShowMap(!showMap)} className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-sm font-bold hover:bg-slate-200 transition">
                                        <MapIcon className="w-4 h-4" /> خريطة
                                    </button>
                                    <span className="text-xs font-medium text-slate-500 hidden sm:inline">إعداد: سمير حبيب بنتن</span>
                                </div>

                                <div className="flex items-center gap-3">
                                    <span className="font-extrabold text-sm md:text-base">
                                        {currentIndex + 1} / {activeQuestions.length}
                                    </span>
                                    {domainInfo && (
                                        <div className={`flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-bold ${domainInfo.bg} ${domainInfo.text}`}>
                                            <DomainIcon className="w-4 h-4" />
                                            <span className="hidden sm:inline">{domainInfo.name}</span>
                                        </div>
                                    )}
                                    {timerDuration > 0 && (
                                        <div className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl border-2 font-mono font-bold text-sm ${getTimerStyle()}`}>
                                            <Clock className="w-4 h-4" />
                                            <span>00:{timeLeft < 10 ? `0${timeLeft}` : timeLeft}</span>
                                        </div>
                                    )}
                                    <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
                                        {darkMode ? <Sun className="w-4 h-4" /> : <Moon className="w-4 h-4" />}
                                    </button>
                                </div>
                            </div>
                            {/* Progress */}
                            <div className="h-1.5 bg-slate-200 dark:bg-slate-700">
                                <div className="h-full bg-etec-primary transition-all duration-300" style={{ width: `${((currentIndex + 1) / activeQuestions.length) * 100}%` }} />
                            </div>
                        </div>

                        <div className="flex-1 max-w-6xl mx-auto w-full p-3 md:p-6 flex flex-col lg:flex-row gap-4">
                            {/* Question Map Sidebar */}
                            {showMap && (
                                <div className="lg:w-56 flex-shrink-0 order-2 lg:order-1">
                                    <div className="glass rounded-2xl p-3 border border-slate-200 dark:border-slate-700 sticky top-20">
                                        <h4 className="text-xs font-bold text-slate-500 mb-2 flex items-center gap-1"><MapIcon className="w-3.5 h-3.5" /> خريطة الأسئلة</h4>
                                        <div className="grid grid-cols-5 sm:grid-cols-8 lg:grid-cols-5 gap-1.5 max-h-64 lg:max-h-[70vh] overflow-y-auto">
                                            {activeQuestions.map((_, idx) => {
                                                const st = getStatus(idx);
                                                const isCurrent = idx === currentIndex;
                                                return (
                                                    <button key={idx} onClick={() => jumpTo(idx)}
                                                        className={`map-btn w-8 h-8 rounded-lg text-xs font-bold border ${statusColors[st]} ${isCurrent ? "ring-2 ring-etec-primary scale-110" : ""}`}
                                                        title={`سؤال ${idx+1}`}>
                                                        {idx + 1}
                                                    </button>
                                                );
                                            })}
                                        </div>
