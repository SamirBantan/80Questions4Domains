                                        <div className="mt-3 text-[10px] space-y-1 text-slate-500">
                                            <div className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-emerald-200 border border-emerald-400"></span> صحيح</div>
                                            <div className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-red-200 border border-red-400"></span> خاطئ</div>
                                            <div className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-amber-200 border border-amber-400"></span> انتهى الوقت</div>
                                            <div className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-slate-200 border border-slate-300"></span> لم يُجب / تخطي</div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Main Question Area */}
                            <div className="flex-1 order-1 lg:order-2">
                                <div className={`glass rounded-3xl p-5 md:p-8 shadow-xl border-r-8 ${domainInfo?.border || "border-etec-400"} fade-in`}>
                                    {timeLeft === 0 && userAnswers[currentIndex] === -1 && (
                                        <div className="mb-4 p-3 bg-amber-100 dark:bg-amber-900/40 border border-amber-300 rounded-xl text-amber-800 dark:text-amber-200 font-bold text-center text-sm">
                                            ⏱ انتهى الوقت! تم الانتقال تلقائياً {mode === "practice" ? "— يمكنك مراجعة التحليل أدناه" : ""}
                                        </div>
                                    )}

                                    <div className="flex justify-between items-start gap-3 mb-5">
                                        <h2 className="text-lg md:text-xl font-bold leading-relaxed flex-1">{currentQ.question}</h2>
                                        <button onClick={copyQuestion} className="flex-shrink-0 flex items-center gap-1 px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold hover:bg-etec-100 dark:hover:bg-etec-900/40 transition" title="نسخ السؤال والخيارات">
                                            <Copy className="w-4 h-4" />
                                            {copiedMsg ? "تم!" : "نسخ"}
                                        </button>
                                    </div>

                                    <div className="grid gap-3">
                                        {currentQ.options.map((option, idx) => {
                                            let style = "border-slate-200 dark:border-slate-600 hover:border-etec-400 hover:bg-etec-50/50 dark:hover:bg-etec-900/20";
                                            let icon = null;
                                            const userAns = userAnswers[currentIndex];
                                            if (showFeedback || (mode === "exam" && userAns !== undefined)) {
                                                if (option.isCorrect && mode === "practice") {
                                                    style = "border-emerald-500 bg-emerald-50 dark:bg-emerald-900/30 ring-2 ring-emerald-200 font-bold";
                                                    icon = <CheckCircle className="text-emerald-600 w-6 h-6 flex-shrink-0" />;
                                                } else if (userAns === idx) {
                                                    if (option.isCorrect) {
                                                        style = "border-emerald-500 bg-emerald-50 dark:bg-emerald-900/30 ring-2 ring-emerald-200 font-bold";
                                                        icon = <CheckCircle className="text-emerald-600 w-6 h-6 flex-shrink-0" />;
                                                    } else {
                                                        style = "border-red-500 bg-red-50 dark:bg-red-900/30 ring-2 ring-red-200";
                                                        icon = <XCircle className="text-red-600 w-6 h-6 flex-shrink-0" />;
                                                    }
                                                } else if (mode === "practice") {
                                                    style = "border-slate-100 dark:border-slate-700 opacity-60";
                                                }
                                            }
                                            return (
                                                <button key={idx} onClick={() => handleAnswer(idx)} disabled={showFeedback || userAns !== undefined}
                                                    className={`flex items-center justify-between p-4 rounded-2xl border-2 text-right text-base transition-all ${style}`}>
                                                    <span className="flex-1 ml-3 leading-relaxed">{option.text}</span>
                                                    {icon}
                                                </button>
                                            );
                                        })}
                                    </div>

                                    {showFeedback && mode === "practice" && (
                                        <div className="mt-6 p-5 rounded-2xl bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 fade-in">
                                            <div className="flex items-start gap-3">
                                                <Info className="w-5 h-5 text-etec-600 mt-0.5 flex-shrink-0" />
                                                <div>
                                                    <h4 className="font-bold mb-1.5">التحليل والتوضيح المهني:</h4>
                                                    <p className="text-sm leading-relaxed text-slate-700 dark:text-slate-300">
                                                        {currentQ.options[userAnswers[currentIndex]]?.rationale || currentQ.options.find(o => o.isCorrect)?.rationale}
                                                    </p>
                                                    {userAnswers[currentIndex] !== undefined && userAnswers[currentIndex] >= 0 && !currentQ.options[userAnswers[currentIndex]]?.isCorrect && (
                                                        <p className="text-emerald-700 dark:text-emerald-400 mt-2 font-bold text-sm">
                                                            الإجابة الصحيحة: {currentQ.options.find(o => o.isCorrect)?.text}
                                                        </p>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {/* Notes */}
                                    <div className="mt-4">
                                        <textarea
                                            placeholder="ملاحظة شخصية على هذا السؤال (تُحفظ محلياً)..."
                                            value={notes[currentIndex] || ""}
                                            onChange={e => setNotes(prev => ({ ...prev, [currentIndex]: e.target.value }))}
                                            className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-600 dark:bg-slate-800 text-sm resize-none h-16 focus:ring-2 focus:ring-etec-400 outline-none"
                                        />
                                    </div>
                                </div>

                                {/* Navigation Footer */}
                                <div className="flex flex-wrap justify-between items-center gap-3 mt-4">
                                    <div className="flex gap-2">
                                        <button onClick={goPrev} disabled={currentIndex === 0 || mode === "exam"}
                                            className="flex items-center gap-1 px-4 py-2.5 rounded-xl bg-slate-200 dark:bg-slate-700 font-bold text-sm disabled:opacity-40 hover:bg-slate-300 transition">
                                            <ChevronRight className="w-4 h-4" /> السابق
                                        </button>
                                        <button onClick={skipQuestion} disabled={userAnswers[currentIndex] !== undefined}
                                            className="flex items-center gap-1 px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-sm disabled:opacity-40 hover:bg-slate-200 transition">
                                            <Skip className="w-4 h-4" /> تخطي
                                        </button>
                                    </div>

                                    <button onClick={() => goNext()}
                                        className="flex items-center gap-2 px-6 py-3 rounded-xl bg-etec-primary text-white font-bold shadow-lg hover:bg-etec-dark transition">
                                        {currentIndex === activeQuestions.length - 1 ? "عرض النتيجة النهائية" : "السؤال التالي"}
                                        <ChevronLeft className="w-5 h-5" />
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // ========== RESULTS ==========
            if (step === "results") {
                const score = calculateScore();
                const byDomain = [1,2,3,4].map(d => {
                    const qs = activeQuestions.filter(q => q.domain === d);
                    let c = 0;
                    qs.forEach(q => {
                        const idx = activeQuestions.indexOf(q);
                        const ans = userAnswers[idx];
                        if (ans >= 0 && q.options[ans]?.isCorrect) c++;
                    });
                    return { domain: d, total: qs.length, correct: c, pct: qs.length ? Math.round((c/qs.length)*100) : 0 };
                }).filter(x => x.total > 0);

                return (
                    <div className="min-h-screen etec-pattern flex items-center justify-center p-4 md:p-8">
                        <div className="max-w-3xl w-full glass rounded-3xl p-6 md:p-10 shadow-2xl fade-in border border-slate-200 dark:border-slate-700">
                            <div className="text-center mb-8">
                                <div className="relative inline-block mb-4">
                                    <svg className="w-36 h-36 transform -rotate-90">
                                        <circle className="text-slate-200 dark:text-slate-700" strokeWidth="10" stroke="currentColor" fill="transparent" r="60" cx="72" cy="72" />
                                        <circle className="text-etec-primary transition-all duration-1000" strokeWidth="10" strokeDasharray={377} strokeDashoffset={377 - (377 * score.percentage) / 100} strokeLinecap="round" stroke="currentColor" fill="transparent" r="60" cx="72" cy="72" />
                                    </svg>
                                    <div className="absolute inset-0 flex items-center justify-center">
                                        <span className="text-3xl font-extrabold">{score.percentage}%</span>
                                    </div>
                                </div>
                                <h2 className="text-2xl md:text-3xl font-bold mb-1">
                                    {score.percentage >= 80 ? "إنجاز متميز! أداء مهني رائع" : score.percentage >= 60 ? "نتيجة جيدة — واصل التحسين" : "تم إنهاء الاختبار"}
                                </h2>
                                <p className="text-slate-600 dark:text-slate-300">
                                    أجبت صحيحاً على <span className="font-extrabold text-etec-primary">{score.correct}</span> من أصل <span className="font-bold">{score.total}</span>
                                </p>
                                <p className="text-sm text-slate-500 mt-1">خاطئ: {score.wrong} | انتهى الوقت: {score.timeout} | تخطي/بدون إجابة: {score.skipped}</p>
                            </div>

                            {/* Domain breakdown */}
                            {byDomain.length > 0 && (
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                                    {byDomain.map(d => {
                                        const m = DOMAIN_META[d.domain];
                                        return (
                                            <div key={d.domain} className={`p-3 rounded-xl ${m.bg} text-center`}>
                                                <div className="text-xs font-bold mb-1">{m.name}</div>
                                                <div className="text-xl font-extrabold">{d.pct}%</div>
                                                <div className="text-[10px]">{d.correct}/{d.total}</div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}

                            {/* Map for review */}
                            <div className="mb-6 p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700">
                                <h4 className="font-bold text-sm mb-3">خريطة المراجعة السريعة</h4>
                                <div className="grid grid-cols-8 sm:grid-cols-10 gap-1.5">
                                    {activeQuestions.map((_, idx) => {
                                        const st = getStatus(idx);
                                        const colors = { green: "bg-emerald-300", red: "bg-red-300", yellow: "bg-amber-300", gray: "bg-slate-300" };
                                        return (
                                            <button key={idx} onClick={() => { setCurrentIndex(idx); setStep("quiz"); setShowFeedback(true); setIsTimerRunning(false); }}
                                                className={`w-8 h-8 rounded-lg text-xs font-bold ${colors[st]} hover:scale-110 transition`} title={`سؤال ${idx+1}`}>
                                                {idx+1}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="bg-etec-50 dark:bg-etec-900/30 p-5 rounded-2xl mb-6 border border-etec-100 dark:border-etec-800">
                                <h4 className="font-bold text-etec-900 dark:text-etec-200 mb-2 flex items-center gap-2"><Info className="w-5 h-5" /> التوصية المهنية</h4>
                                <p className="text-sm text-etec-800 dark:text-etec-300 leading-relaxed">
                                    {score.percentage >= 80
                                        ? "تمتلك حصيلة معرفية وتطبيقية ممتازة تتوافق مع المعايير الوطنية للرخصة المهنية للمدربين. واصل الاطلاع على مهارات الذكاء الاصطناعي وتطبيقات المستقبل."
                                        : "نتيجة طيبة! ننصح بمراجعة مجالات الفجوات عبر خريطة الأسئلة وتكرار الأسئلة ذات التحليل الفني لترسيخ المفاهيم قبل الاختبار الرسمي."}
                                </p>
                            </div>

                            <div className="flex flex-col sm:flex-row gap-3">
                                <button onClick={() => startQuiz(selectedDomain, mode)} className="flex-1 flex items-center justify-center gap-2 py-3.5 rounded-xl bg-slate-200 dark:bg-slate-700 font-bold hover:bg-slate-300 transition">
                                    <Refresh className="w-5 h-5" /> إعادة الاختبار
                                </button>
                                <button onClick={() => { setStep("quiz"); setCurrentIndex(0); setShowFeedback(true); setIsTimerRunning(false); }} className="flex-1 flex items-center justify-center gap-2 py-3.5 rounded-xl bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-200 font-bold hover:bg-amber-200 transition">
                                    مراجعة الإجابات
                                </button>
                                <button onClick={resetToHome} className="flex-1 flex items-center justify-center gap-2 py-3.5 rounded-xl bg-etec-primary text-white font-bold shadow hover:bg-etec-dark transition">
                                    <Home className="w-5 h-5" /> اختيار مجال آخر
                                </button>
                            </div>

                            <p className="text-center text-xs text-slate-500 mt-6">إعداد المهندس سمير حبيب بنتن — مستوحى من معايير ETEC</p>
                        </div>
                    </div>
                );
            }

            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<QuizApp />);
    </script>
</body>
</html>
